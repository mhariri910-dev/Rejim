name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # الصفحة تُنسخ إلى assets قبل البناء، فتبقى نسخة واحدة فقط في المستودع
      - name: Sync web app into Android assets
        run: cp index.html android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rejim.apk

      # تنزيل بضغطة واحدة بلا فكّ ضغط
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create latest rejim.apk \
            --title "رجيمات — أحدث نسخة" \
            --notes "ملف تثبيت تطبيق رجيمات للأندرويد.

نزّل **rejim.apk** وثبّته مباشرة.

بُني تلقائيًا من آخر تحديث للمستودع." \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rejim-APK
          path: rejim.apk
