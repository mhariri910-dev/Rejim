<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>رجيمات</title>
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0B1017" media="(prefers-color-scheme: dark)"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="description" content="رجيمات يومية — خطط غذائية يوم بيوم مع متابعة الوزن ومؤشر كتلة الجسم"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
/* ===================================================================
   رجيمات يومية — نظام تصميم موحّد
   أُعيدت كتابة التنسيق بالكامل. أسماء الأصناف والمعرّفات لم تتغيّر،
   ومحتوى الرجيمات لم يُمَس.
   =================================================================== */

:root{
  color-scheme: light;

  /* الأساس */
  --bg:#F4F6F8;
  --bg-tint-1:rgba(15,157,116,.10);
  --bg-tint-2:rgba(56,132,255,.08);
  --card:#FFFFFF;
  --card-soft:#FAFBFC;

  /* النص */
  --text:#111A22;
  --muted:#5A6B7A;
  --faint:#8A99A8;

  /* الحدود والظلال */
  --line:rgba(17,26,34,.10);
  --line-soft:rgba(17,26,34,.06);
  --shadow-sm:0 1px 2px rgba(17,26,34,.05), 0 2px 8px rgba(17,26,34,.04);
  --shadow-md:0 2px 6px rgba(17,26,34,.06), 0 12px 28px rgba(17,26,34,.07);
  --shadow-lg:0 8px 20px rgba(17,26,34,.10), 0 24px 56px rgba(17,26,34,.14);

  /* الألوان الدالّة */
  --accent:#0F9D74;
  --accent-ink:#0A7557;
  --accent-soft:rgba(15,157,116,.12);
  --accent1:#0F9D74;
  --accent2:#2DB7A3;
  --warm:#E07B39;

  --ok:#16A34A;
  --info:#2563EB;
  --warn:#D97706;
  --danger:#DC2626;

  /* ألوان الوجبات */
  --m-breakfast:#E8A33D;
  --m-lunch:#17A34A;
  --m-dinner:#6366F1;
  --m-snack:#EC5F7A;
  --m-generic:#2DB7A3;

  /* أبعاد */
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --tap:46px;

  /* توافق مع أسماء قديمة */
  --bg1:var(--bg);
  --bg2:var(--bg);
  --chip:var(--line-soft);
  --border:var(--line);
}

body.dark{
  color-scheme: dark;

  --bg:#0B1017;
  --bg-tint-1:rgba(15,157,116,.14);
  --bg-tint-2:rgba(56,132,255,.10);
  --card:#141C25;
  --card-soft:#18212B;

  --text:#E9EFF4;
  --muted:#9FB0BF;
  --faint:#74869A;

  --line:rgba(255,255,255,.11);
  --line-soft:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.40), 0 2px 8px rgba(0,0,0,.30);
  --shadow-md:0 2px 6px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.40);
  --shadow-lg:0 8px 20px rgba(0,0,0,.55), 0 24px 56px rgba(0,0,0,.50);

  --accent:#2DBE92;
  --accent-ink:#49D6A9;
  --accent-soft:rgba(45,190,146,.16);
  --accent1:#2DBE92;
  --accent2:#3FCFC0;
}

/* ---------- الأساسيات ---------- */

*{box-sizing:border-box;}
*:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

html{-webkit-text-size-adjust:100%;}

body{
  margin:0;
  padding:16px 16px calc(104px + env(safe-area-inset-bottom)) 16px;
  padding-top:calc(16px + env(safe-area-inset-top));
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:16px;
  line-height:1.65;
  color:var(--text);
  background:
    radial-gradient(900px 420px at 88% -8%, var(--bg-tint-1), transparent 62%),
    radial-gradient(760px 380px at 8% 4%, var(--bg-tint-2), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}

/* حاوية مريحة على الشاشات الكبيرة */
body > .card,
body > nav,
body > .bottomNav{max-width:760px; margin-inline:auto;}

h1{margin:0 0 6px; font-size:21px; font-weight:800; line-height:1.35; letter-spacing:-.2px;}
h2{margin:16px 0 8px; font-size:17px; font-weight:800; line-height:1.4;}

hr{
  border:none;
  border-top:1px solid var(--line-soft);
  margin:16px 0;
}

.small{color:var(--muted); font-size:14px; line-height:1.7;}

ul{margin:8px 0 0; padding-inline-start:20px;}
li{margin:7px 0; line-height:1.75;}

/* ---------- البطاقات ---------- */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:18px;
  margin:14px 0;
  box-shadow:var(--shadow-md);
}

.headerCard{
  position:relative;
  overflow:hidden;
  background:var(--card);
  backdrop-filter:none;
  border:1px solid var(--line);
}
.headerCard::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:4px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--warm));
}

/* ---------- الصفوف والشارات ---------- */

.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.topRow{justify-content:space-between; align-items:center;}

.badge{
  max-width:100%;
  background:var(--card-soft);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 13px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  white-space:nowrap;
}

.pill{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:14px;
  padding:13px 15px;
  border-radius:var(--r-md);
  border:1px solid var(--accent-soft);
  background:var(--accent-soft);
  color:var(--accent-ink);
  font-size:14.5px;
  font-weight:600;
  line-height:1.5;
}
.pill::before{
  content:"";
  flex:none;
  width:8px; height:8px;
  border-radius:999px;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}

/* ---------- عناصر الإدخال ---------- */

select,input{
  font-family:inherit;
  font-size:16px;
  min-height:var(--tap);
  padding:11px 13px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--card-soft);
  color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease;
}
select{min-width:190px; font-weight:600;}
select:focus,input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

/* ---------- الأزرار ---------- */

button{
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  min-height:var(--tap);
  padding:11px 16px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--card-soft);
  color:var(--text);
  cursor:pointer;
  transition:transform .12s ease, filter .15s ease, background .15s ease;
}
button:hover{filter:brightness(.97);}
button:active{transform:translateY(1px);}

.btnPrimary,.primaryBtn,button.primary{
  border:none;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;
  box-shadow:0 4px 14px var(--accent-soft);
  text-shadow:none;
}
.btnPrimary:hover,.primaryBtn:hover{filter:brightness(1.05);}

.btnSoft,.softBtn{
  background:var(--card-soft);
  border:1px solid var(--line);
  color:var(--text);
}

/* متغيّرات لونية يستدعيها الكود */
.btn{background:var(--card-soft);}
.btnSecondary{background:var(--info); color:#fff; border:none;}
.btnSuccess{background:var(--ok); color:#fff; border:none;}
.btnWarning{background:var(--warn); color:#fff; border:none;}
.btnDanger{background:var(--danger); color:#fff; border:none;}

.linkBtn{
  flex:none;
  border:1px solid var(--line);
  background:var(--card);
  padding:9px 14px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
  color:var(--accent-ink);
  min-height:auto;
}

.iconBtn{
  flex:none;
  width:42px; height:42px;
  min-height:42px;
  padding:0;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--card-soft);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.topRow .iconBtn{margin-inline-start:auto;}
.iconSun,.iconMoon{display:none; font-size:17px; line-height:1;}
.iconSun::before{content:"☀";}
.iconMoon::before{content:"☾";}
body.dark .iconSun{display:inline;}
body:not(.dark) .iconMoon{display:inline;}

/* ---------- نصيحة اليوم ---------- */

.tipRow{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-top:14px;
  padding:13px 15px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.tipLine{
  flex:1;
  font-size:14.5px;
  line-height:1.6;
  color:var(--text);
  font-weight:600;
}
.tipMore{
  margin-top:10px;
  padding:14px 16px;
  border-radius:var(--r-md);
  background:var(--card-soft);
  border:1px solid var(--line);
  font-size:14.5px;
  color:var(--muted);
  line-height:1.8;
}

/* ---------- تقدّم اليوم ---------- */

.dayProgress{
  margin-top:14px;
  padding:14px 16px;
  background:var(--card-soft);
  border:1px solid var(--line);
  border-radius:var(--r-md);
}
.progBar{
  margin-top:10px;
  height:10px;
  border-radius:999px;
  background:var(--line);
  overflow:hidden;
}
.progFill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  transition:width .35s cubic-bezier(.4,0,.2,1);
}

/* ---------- الوجبات ---------- */

#mealBox{margin-top:4px;}

.mealSection{
  position:relative;
  margin:12px 0;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--card);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.mealSection::before{
  content:"";
  position:absolute;
  inset-block:0;
  inset-inline-start:0;
  width:4px;
  background:var(--m-generic);
}
.meal-breakfast::before{background:var(--m-breakfast);}
.meal-lunch::before{background:var(--m-lunch);}
.meal-dinner::before{background:var(--m-dinner);}
.meal-snack::before{background:var(--m-snack);}

.mealTitle{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--line-soft);
  background:var(--card-soft);
}
.mealTitle::before{
  content:"";
  flex:none;
  width:9px; height:9px;
  border-radius:999px;
  background:var(--m-generic);
}
.meal-breakfast .mealTitle::before{background:var(--m-breakfast);}
.meal-lunch .mealTitle::before{background:var(--m-lunch);}
.meal-dinner .mealTitle::before{background:var(--m-dinner);}
.meal-snack .mealTitle::before{background:var(--m-snack);}

.mealSection ul{margin:10px 0; padding-inline-start:20px; padding-inline-end:14px;}
.mealSection li{margin:9px 0; line-height:1.85;}
.mealSection > div{padding:4px 16px 10px;}

/* ---------- النوافذ المنبثقة ---------- */

.modal{
  position:fixed;
  inset:0;
  background:rgba(8,14,20,.55);
  backdrop-filter:blur(3px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:80;
}
.modal.show,.modal.open{display:flex;}

.modalCard{
  width:min(540px,100%);
  max-height:88vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);
  padding:18px;
}
.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px;
}
.modalTitle{font-size:18px; font-weight:800;}
.iconClose{
  flex:none;
  width:38px; height:38px;
  min-height:38px;
  padding:0;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--card-soft);
  font-size:20px;
  line-height:1;
  color:var(--muted);
}

/* ---------- الحقول ---------- */

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.field{
  display:block;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:12px;
  background:var(--card-soft);
}
.field .lbl,.lbl{
  display:block;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:7px;
}
.field input,.field select{
  width:100%;
  background:var(--card);
}

.outBox{
  background:var(--card-soft);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 16px;
  line-height:1.8;
  white-space:pre-line;
}

/* ---------- مؤشر كتلة الجسم ---------- */

.bmiBar{
  position:relative;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--line);
  background:linear-gradient(90deg,
    #EC5F7A 0 18%, #17A34A 18% 40%, #E8A33D 40% 60%, #EC5F7A 60% 100%);
}
.bmiMarker{
  position:absolute;
  top:-6px;
  width:2px;
  height:24px;
  background:var(--text);
}
.bmiMarker::after{
  content:"";
  position:absolute;
  top:-3px;
  left:-6px;
  width:14px; height:14px;
  border-radius:999px;
  background:var(--card);
  border:2px solid var(--text);
}
.bmiLegend{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--faint);
  margin-top:8px;
}
.bmiLine{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid var(--line-soft);
}
.bmiLine:last-child{border-bottom:none;}

/* ---------- الجداول ---------- */

.tableWrap{
  overflow:auto;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card);
}
.tModern{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:480px;
  font-size:14.5px;
}
.tModern th,.tModern td{
  padding:12px 14px;
  border-bottom:1px solid var(--line-soft);
  text-align:right;
  vertical-align:middle;
}
.tModern thead th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--card-soft);
  font-size:13px;
  font-weight:700;
  color:var(--muted);
}
.tModern tbody tr:last-child td{border-bottom:none;}
.tModern tbody tr:hover{background:var(--accent-soft);}
.tModern td:last-child{text-align:left;}
.iconMini{width:18px; height:18px; display:inline-block; vertical-align:middle;}

/* ---------- شريط التنقل السفلي ---------- */

.bottomNav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:60;
  display:flex;
  gap:8px;
  padding:9px;
  border-radius:var(--r-lg);
  background:color-mix(in srgb, var(--card) 86%, transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(180%);
  box-shadow:var(--shadow-lg);
}
.navBtn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:56px;
  padding:8px 6px;
  border:none;
  border-radius:var(--r-md);
  background:transparent;
  color:var(--muted);
}
.navBtn:hover{background:var(--card-soft); filter:none;}
.navMain{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;
}
.navMain:hover{background:linear-gradient(135deg,var(--accent1),var(--accent2)); filter:brightness(1.05);}
.navI{
  width:21px;
  height:21px;
  display:inline-flex;
}
.navI svg{width:100%; height:100%; fill:currentColor;}
.navT{font-size:12px; font-weight:700; letter-spacing:.1px;}

/* ---------- تجاوب ---------- */

@media (max-width:520px){
  body{padding-inline:12px;}
  .card{padding:16px; border-radius:20px;}
  h1{font-size:20px;}
  .grid2{grid-template-columns:1fr;}
  select{min-width:100%;}
  .row > select{flex:1 1 100%;}
  .row > button:not(.iconBtn):not(.mealCheck):not(.dayChip):not(.cup){flex:1 1 auto;}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}

@media print{
  .bottomNav,.iconBtn,.linkBtn,.modal{display:none !important;}
  body{padding:0; background:#fff;}
  .card{box-shadow:none; border:1px solid #ccc;}
}

/* ===================================================================
   تنسيق الإضافات: اختيار اليوم، إنجاز الوجبات، الماء، النصيحة
   =================================================================== */

/* ---------- اختيار أي يوم ---------- */

.dayPick{
  margin-top:14px;
  padding:13px 14px 11px;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--card-soft);
}
.dayPickHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:11px;
}
.dayPickLbl{font-size:13px; font-weight:700; color:var(--muted);}
.dayPickTools{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}

.dayJump{
  width:74px;
  min-height:38px;
  padding:7px 10px;
  font-size:15px;
  font-weight:700;
  text-align:center;
  border-radius:999px;
  background:var(--card);
}
.dayJump::-webkit-outer-spin-button,
.dayJump::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.dayJump{-moz-appearance:textfield;}

.dayStrip{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 2px 9px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.dayStrip::-webkit-scrollbar{height:5px;}
.dayStrip::-webkit-scrollbar-thumb{background:var(--line); border-radius:999px;}
.dayStrip::-webkit-scrollbar-track{background:transparent;}

.dayChip{
  flex:0 0 auto;
  width:42px;
  min-height:42px;
  padding:0;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.dayChip:hover{border-color:var(--accent); color:var(--accent-ink); filter:none;}
.dayChip.on{
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;
  box-shadow:0 4px 12px var(--accent-soft);
}

/* ---------- إنجاز الوجبات ---------- */

.mealCheck{
  margin-inline-start:auto;
  flex:none;
  width:28px; height:28px;
  min-height:28px;
  padding:0;
  border-radius:999px;
  border:2px solid var(--line);
  background:var(--card);
  position:relative;
}
.mealCheck::after{
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:10px; height:6px;
  border-inline-start:2.5px solid #fff;
  border-bottom:2.5px solid #fff;
  transform:rotate(-45deg) translate(1px,-2px);
  opacity:0;
  transition:opacity .15s ease;
}
.mealCheck.on{background:var(--accent); border-color:var(--accent);}
.mealCheck.on::after{opacity:1;}

.mealSection.done{opacity:.62;}
.mealSection.done .mealTitle::after{content:"✓ تمّت"; font-size:12px; font-weight:800; padding:2px 9px; border-radius:999px; margin-inline-start:8px; background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok);}

.doneLine{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line-soft);
  font-size:13.5px;
  font-weight:700;
  color:var(--muted);
}
.doneDots{display:flex; gap:5px; flex:1;}
.doneDots i{
  flex:1;
  max-width:34px;
  height:7px;
  border-radius:999px;
  background:var(--line);
  transition:background .2s ease;
}
.doneDots i.on{background:var(--accent);}
.doneNum,#waterCount,#dayProgPct{
  font-variant-numeric:tabular-nums;
  direction:ltr;            /* يمنع انقلاب "0 / 5" في النص العربي */
  unicode-bidi:isolate;
}
.doneNum{color:var(--accent-ink);}

/* ---------- شرب الماء ---------- */

.cups{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
}
.cup{
  position:relative;
  aspect-ratio:3/4;
  min-height:0;
  padding:0;
  border-radius:9px 9px 13px 13px;
  border:2px solid var(--line);
  background:var(--card-soft);
  overflow:hidden;
}
.cup::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:0%;
  background:linear-gradient(180deg,#5BC8FF,#2E9BD6);
  transition:height .28s cubic-bezier(.4,0,.2,1);
}
.cup.on{border-color:#2E9BD6;}
.cup.on::after{height:100%;}

/* ---------- نصيحة اليوم ---------- */

.tipRow{
  flex-wrap:wrap;
  border-inline-start:4px solid var(--warm);
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--warm) 9%, var(--card-soft)), var(--card-soft));
}
.tipLine{
  flex:1 1 100%;
  display:flex;
  align-items:flex-start;
  gap:9px;
}
.tipLine::before{
  content:"💡";
  flex:none;
  font-size:17px;
  line-height:1.4;
}
.tipRow .linkBtn{flex:0 0 auto;}

/* ---------- بطاقة «الآن» ---------- */

.nowCard{
  position:relative;
  overflow:hidden;
  padding:0;
  border:1px solid var(--line);
  background:var(--card);
}
.nowCard::before{
  content:"";
  position:absolute;
  inset-block:0;
  inset-inline-start:0;
  width:5px;
  background:linear-gradient(180deg,var(--accent1),var(--accent2));
}

.nowTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding:16px 18px 12px;
}
.nowLbl{font-size:12px; font-weight:700; color:var(--faint); letter-spacing:.4px;}
.nowClock{
  font-size:30px;
  font-weight:800;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
  direction:ltr;
  unicode-bidi:isolate;
}
.nowDay{text-align:start; max-width:58%;}
.nowPlan{font-size:14.5px; font-weight:800; line-height:1.4;}
.nowDayNo{font-size:12.5px; color:var(--muted); margin-top:2px;}

.nowHead{
  display:block;
  margin:0 18px 14px;
  padding:14px 16px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.nowBig{display:block; font-size:19px; font-weight:800; line-height:1.3;}
.nowSub{display:block; margin-top:4px; font-size:13.5px; color:var(--muted);}

.nowHead.live{
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;
}
.nowHead.live .nowSub{color:rgba(255,255,255,.92);}
.nowHead.soon{
  border-color:color-mix(in srgb, var(--warm) 35%, transparent);
  background:color-mix(in srgb, var(--warm) 10%, var(--card-soft));
}

.nowBar{
  display:block;
  margin-top:11px;
  height:6px;
  border-radius:999px;
  background:rgba(255,255,255,.30);
  overflow:hidden;
}
.nowBar i{display:block; height:100%; background:#fff; border-radius:999px;}

.nowList{
  display:flex;
  flex-direction:column;
  border-top:1px solid var(--line-soft);
}
.nowRow{
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"dot name when" "dot note note";
  align-items:center;
  gap:2px 11px;
  width:100%;
  min-height:0;
  padding:13px 18px;
  border:none;
  border-bottom:1px solid var(--line-soft);
  border-radius:0;
  background:transparent;
  text-align:start;
  font-weight:500;
}
.nowRow:last-child{border-bottom:none;}
.nowRow:hover{background:var(--card-soft); filter:none;}

.nowDot{
  grid-area:dot;
  width:11px; height:11px;
  border-radius:999px;
  background:var(--line);
  box-shadow:0 0 0 3px transparent;
}
.nowName{
  grid-area:name;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  font-weight:700;
}
.nowWhen{
  grid-area:when;
  font-size:13.5px;
  font-weight:700;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  direction:ltr;
  unicode-bidi:isolate;
}
.nowNote{grid-area:note; font-size:12.5px; color:var(--faint);}

.nowTag{
  font-size:11px;
  font-weight:800;
  padding:2px 8px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

.nowRow.live .nowDot{background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.nowRow.live .nowName{color:var(--accent-ink);}
.nowRow.next .nowDot{background:var(--warm); box-shadow:0 0 0 4px color-mix(in srgb,var(--warm) 18%,transparent);}
.nowRow.next .nowTag{background:color-mix(in srgb,var(--warm) 16%,transparent); color:var(--warm);}
.nowRow.past{opacity:.5;}
.nowRow.done .nowDot{background:var(--ok);}
.nowRow.done .nowName{text-decoration:none;}
.nowRow.done .nowTag{font-size:12px;}
.nowRow.done .nowTag{background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok);}

.mealSection.flash{
  animation:flashSec 1.2s ease;
}
@keyframes flashSec{
  0%,100%{box-shadow:var(--shadow-sm);}
  30%    {box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-md);}
}

/* ===================================================================
   طبقة التقدّم + لمسات تصميم أحدث
   =================================================================== */

.secHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.secHead h2{margin:0; font-size:18px;}

/* ---------- بطاقات الأرقام ---------- */

.statGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  padding:15px 8px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
  text-align:center;
}
.stat:first-child{
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;
  box-shadow:0 6px 18px var(--accent-soft);
}
.stat:first-child .statL{color:rgba(255,255,255,.9);}
.statV{font-size:27px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums;}
.statL{font-size:12px; font-weight:600; color:var(--muted); margin-top:4px;}

/* ---------- وزن الهدف ---------- */

.goalBox{
  margin-top:14px;
  padding:15px 16px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.goalBox.reached{
  border-color:color-mix(in srgb,var(--ok) 40%,transparent);
  background:color-mix(in srgb,var(--ok) 9%,var(--card-soft));
}
.goalTop{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.goalLbl{font-size:14px; font-weight:700;}
.goalEdit{display:flex; align-items:center; gap:7px;}
.goalEdit input{
  width:86px; min-height:38px; padding:7px 10px;
  text-align:center; font-weight:700; border-radius:999px; background:var(--card);
}
.goalBar{
  margin-top:13px;
  height:10px;
  border-radius:999px;
  background:var(--line);
  overflow:hidden;
}
.goalBar i{
  display:block; height:100%; width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.goalTxt{margin-top:9px;}

/* ---------- اتجاه الوزن ---------- */

.trendBox{
  margin-top:14px;
  padding:15px 16px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.trendTop{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.trendLbl{font-size:14px; font-weight:700;}
.trendDelta{font-size:13px; font-weight:800;}
.trendDelta.down{color:var(--ok);}
.trendDelta.up{color:var(--warm);}

.trendChart{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:6px;
  min-height:110px;
  margin:14px 0 10px;
}
.trendEmpty{align-self:center; margin:0 auto; text-align:center;}
.tBarWrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;}
.tVal{font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
.tBar{
  width:100%;
  max-width:30px;
  border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--accent) 45%,transparent),
    color-mix(in srgb,var(--accent) 22%,transparent));
}
.tBar.on{background:linear-gradient(180deg,var(--accent1),var(--accent2));}
.tLbl{font-size:10.5px; color:var(--faint); white-space:nowrap;}

/* ---------- الخصر والملاحظة ---------- */

.waistBox{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:14px;
  padding:14px 16px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.waistLbl{flex:1; font-size:14px; font-weight:700;}
.waistIn{display:flex; align-items:center; gap:7px;}
.waistIn input{
  width:86px; min-height:38px; padding:7px 10px;
  text-align:center; font-weight:700; border-radius:999px; background:var(--card);
}
.waistOut{flex:1 1 100%;}

.noteBox{margin-top:14px;}
.noteLbl{display:block; font-size:14px; font-weight:700; margin-bottom:8px;}
.noteBox textarea{
  width:100%;
  font-family:inherit;
  font-size:15px;
  line-height:1.7;
  padding:13px 15px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
  color:var(--text);
  resize:vertical;
}
.noteBox textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

/* ---------- التقويم الشهري ---------- */

.calBox{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line-soft);
}
.calHead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
.calTitle{font-size:15px; font-weight:800;}
.calNav{width:36px; height:36px; min-height:36px; font-size:18px; line-height:1;}

.calDow{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-bottom:6px;
}
.calDow span{text-align:center; font-size:10.5px; font-weight:700; color:var(--faint);}

.calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.calCell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:12.5px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  background:var(--card-soft);
  border:1px solid var(--line-soft);
  color:var(--faint);
}
.calCell.empty{background:transparent; border:none;}
.calCell.part{
  background:color-mix(in srgb,var(--accent) 22%,transparent);
  border-color:transparent;
  color:var(--accent-ink);
}
.calCell.full{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  border-color:transparent;
  color:#fff;
}
.calCell.today{box-shadow:0 0 0 2px var(--text);}

.calKey{display:flex; align-items:center; gap:7px; margin-top:12px; flex-wrap:wrap;}
.calKey i{
  width:13px; height:13px;
  border-radius:4px;
  display:inline-block;
  border:1px solid var(--line-soft);
}
.calKey i.full{background:linear-gradient(135deg,var(--accent1),var(--accent2)); border-color:transparent;}
.calKey i.part{background:color-mix(in srgb,var(--accent) 22%,transparent); border-color:transparent;}
.calKey i.none{background:var(--card-soft);}

/* ===================================================================
   لمسات تصميم إضافية على كامل التطبيق
   =================================================================== */

body{
  background:
    radial-gradient(1100px 520px at 92% -12%, var(--bg-tint-1), transparent 60%),
    radial-gradient(820px 420px at 4% 2%,   var(--bg-tint-2), transparent 58%),
    radial-gradient(640px 640px at 50% 112%, var(--bg-tint-1), transparent 62%),
    var(--bg);
}

.card{
  animation:rise .34s cubic-bezier(.22,1,.36,1) both;
}
.card:nth-of-type(2){animation-delay:.04s;}
.card:nth-of-type(3){animation-delay:.08s;}
.card:nth-of-type(4){animation-delay:.12s;}
@keyframes rise{
  from{opacity:0; transform:translateY(10px);}
  to  {opacity:1; transform:none;}
}

.nowCard{box-shadow:var(--shadow-lg);}

.bottomNav{box-shadow:0 10px 24px rgba(0,0,0,.10), 0 26px 60px rgba(0,0,0,.14);}
body.dark .bottomNav{box-shadow:0 10px 24px rgba(0,0,0,.45), 0 26px 60px rgba(0,0,0,.55);}

.btnPrimary,.primaryBtn{letter-spacing:.2px;}
.badge{backdrop-filter:blur(6px);}

@media (prefers-reduced-motion:reduce){
  .card{animation:none;}
}

/* ---------- المزامنة السحابية ---------- */

.syncDot{
  width:11px; height:11px;
  border-radius:999px;
  background:var(--line);
  box-shadow:0 0 0 3px transparent;
}
.syncDot.on{background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);}
.syncDot.off{background:var(--faint);}

.syncMsg{font-size:14px; line-height:1.75; color:var(--muted);}
.syncMsg.warn{
  padding:14px 16px;
  border-radius:var(--r-md);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,var(--card-soft));
}
.syncMsg.warn b{display:block; color:var(--warn); margin-bottom:5px; font-size:14.5px;}

.syncCard textarea{
  width:100%;
  margin-top:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;
  line-height:1.6;
  direction:ltr;
  text-align:left;
  padding:12px 14px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
  color:var(--text);
  resize:vertical;
}
.syncCard textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

.syncHelp{
  margin-top:12px;
  padding:14px 16px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
  font-size:13.5px;
  line-height:1.9;
  color:var(--muted);
}
.syncHelp ol{margin:0; padding-inline-start:20px;}
.syncHelp li{margin:7px 0;}
.syncHelp b{color:var(--text);}
.syncHelp pre{
  direction:ltr;
  text-align:left;
  margin:8px 0 0;
  padding:11px 13px;
  border-radius:10px;
  background:var(--card);
  border:1px solid var(--line);
  font-size:11.5px;
  line-height:1.6;
  overflow:auto;
  white-space:pre;
}

.syncUser{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:13px 15px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
}
.syncWho{font-size:14.5px; font-weight:700; word-break:break-all;}

/* ---------- شارة تصنيف النظام ---------- */

.planBadge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin:8px 0 2px;
  padding:7px 14px 7px 12px;
  min-height:32px;
  border-radius:999px;
  border:1px solid transparent;
  font-size:12.5px;
  font-weight:800;
  letter-spacing:.1px;
}
.planBadge::before{
  content:"";
  width:7px; height:7px;
  border-radius:999px;
  background:currentColor;
}
.planBadge::after{
  content:"؟";
  font-size:11px;
  font-weight:700;
  opacity:.55;
  margin-inline-start:2px;
}
.planBadge:hover{filter:brightness(.97);}

.bStrong{
  background:color-mix(in srgb,var(--ok) 14%,transparent);
  border-color:color-mix(in srgb,var(--ok) 35%,transparent);
  color:var(--ok);
}
.bOk{
  background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 32%,transparent);
  color:var(--accent-ink);
}
.bCare{
  background:color-mix(in srgb,var(--warn) 14%,transparent);
  border-color:color-mix(in srgb,var(--warn) 38%,transparent);
  color:var(--warn);
}
.bHype{
  background:color-mix(in srgb,var(--danger) 12%,transparent);
  border-color:color-mix(in srgb,var(--danger) 35%,transparent);
  color:var(--danger);
}

.badgeNote{
  margin-top:8px;
  padding:12px 14px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card-soft);
  font-size:13.5px;
  line-height:1.8;
  color:var(--muted);
}
</style>
</head>
<body>
<div class="card headerCard">
  <div class="row topRow">
    <div class="badge" id="dayNo">اليوم رقم</div>
    <div class="badge" id="today">اليوم</div>
  
    <button id="themeToggle" class="iconBtn" title="وضع ليلي / نهاري" aria-label="Theme toggle">
      <span class="iconSun" aria-hidden="true"></span>
      <span class="iconMoon" aria-hidden="true"></span>
    </button>

  </div>
  <div class="pill" id="progressLine">أنت في اليوم 1</div>
  <div style="height:10px"></div>
  <div class="small">اختر الرجيم (Plan)</div>
  <div class="row">
    <select id="planSel"></select>
    <button id="prevBtn" class="btnSoft">اليوم السابق</button>
    <button id="nextBtn" class="btnSoft">اليوم التالي</button>
    <button id="startBtn" class="btnPrimary">ابدأ من اليوم</button>
  </div>
  <div style="height:8px"></div>
  <div class="small" id="startInfo"></div>
  <div class="tipRow">
    <div class="tipLine" id="tipLine">نصيحة اليوم</div>
    <button class="linkBtn" id="tipMoreBtn" class="btnSoft" type="button">المزيد</button>
  </div>
  <div class="tipMore" id="tipMore" style="display:none"></div>

  <div style="height:6px"></div>
</div>

<div class="card">
  <h1 id="planTitle"></h1>
  <div class="small" id="planMeta"></div>

  <div class="dayProgress" id="dayProgress">
    <div class="row" style="justify-content:space-between; gap:10px;">
      <div class="small" id="dayProgText"></div>
      <div class="small" id="dayProgPct"></div>
    </div>
    <div class="progBar" aria-hidden="true">
      <div class="progFill" id="dayProgFill"></div>
    </div>
  </div>

  <div class="row" style="margin-top:10px">
    <button id="infoBtn" type="button">معلومات الرجيم</button>
  </div>
  <div id="planDesc" class="small" style="display:none; white-space:pre-wrap; margin-top:8px"></div>
  <hr/>
  <h2 id="dayTitle"></h2>
  <div id="mealBox"></div>

م الماء شأن أي برنامج أو نظام رجيم آخر يجب الاعتدال خلال فترة تنفيذه في تناول الطعام، ولذلك يجب الابتعاد عن تناول الأطعمة الغنية بالدهون والسعرات الحرارية المرتفعة والتوجه بشكل أكبر إلي تناول الفواكه والخضروات والأطعمة منخفضة السعرات الحرارية.\n\nوسواء أردت إتباع رجيم الماء أم لا فذلك لا يعني إغفال دور وأهمية الماء لكل إنسان، فبأي حال يجب ألا يقل استهلاك الشخص العادي من الماء عن 8 أكواب من الماء يومياً لضمان توازن الكميات الداخلة والخارجة من السوائل. ومراعاة هذا التوازن يؤدي إلي الإسراع بحرق السعرات الحرارية وإتاحة التعامل مع الدهون الغير مرغوب بها من قبل الكبد بالشكل المطلوب.\n", "i_order": 5, "days": [{"s_name": "اليوم الاول ", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "rm_water", "s_name": "كوب من الماء الدافئ (الفاتر) علي الريق", "i_calories": 0, "i_order": 1}]}, {"s_name": "بعد الإفطار بساعة", "i_order": 2, "list": [{"s_icon": "rm_bread", "s_name": "شريحة توست رجيم", "i_calories": 0, "i_order": 1}, {"s_icon": "rm_egg", "s_name": "بيضة مسلوقة جيداً", "i_calories": 0, "i_order": 2}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "rm_water", "s_name": "2 كوب ماء دافئ قبل تناول الطعام", "i_calories": 0, "i_order": 1}, {"s_icon": "rm_bread", "s_name": "شريحة توست ريجيم", "i_calories": 0, "i_order": 2}, {"s_icon": "rm_meat", "s_name": " 2 قطعة لحم مسلوق أو مشوي", "i_calories": 0, "i_order": 3}, {"s_icon": "rm_soup", "s_name": "طبق شوربة خضار", "i_calories": 0, "i_order": 4}]}, {"s_name": "بعد الغداء بساعة", "i_order": 4, "list": [{"s_icon": "rm_fruit", "s_name": "ثمرة فاكهة للتحلية", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 5, "list": [{"s_icon": "rm_yoghurt", "s_name": "علبة زبادي منزوعة الوجه ويفضل الزبادي خالي أو قليل الدسم", "i_calories": 0, "i_order": 1}, {"s_icon": "rm_juice", "s_name": "كوب من عصير البرتقال", "i_calories": 0, "i_order": 2}]}]}, {"s_name": "اليوم الثاني ", "i_order": 2, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "rm_water", "s_name": "2 كوب من الماء calories": 0, "i_order": 2}]}]}]}, {"s_name": "رجيم سمنة البطن", "s_target": "غير محدد", "i_days": 0, "s_description": "رغم أن أكثر الدهون يتراكم على الأرداف والأفخاذ إلا أن الدراسات تشير إلى ان الدهون المتراكمة على البطن تعتبر الأخطر، حيث تؤدي إلى الإصابة بارتفاع ضغط الدم ، وارتفاع مستوى الكولسترول ، والسكري، ومتلازمة مقاومة الأنسولين ، وأمراض القلب، ولهذا يعتقد العلماء أن زيادة عرض الخصر يمكن أن يكون مؤشرا أساسيا لوجود مشاكل صحية دفينة.\nتؤكد الدراسات أن التهاب حصوات المرارة يكثر في الأشخاص البدينين، ولا سيما السيدات ذوات الحمل المتكرر، وعند الأشخاص المصابين ب\" الكرش\" نتيجة زيادة هرمون الاستروجين، ذلك الهرمون الذي يساعد على زيادة الكولسترول بالدم، مما يؤدي إلى ترسيبه على جدار الحويصلة المرارية ، ويسبب ذلك التهابا بها وتكوين حصوات المرارة.\nوفي الأفراد المصابين ب\" الكرش\" تتراكم الدهون على القفص الصدري وتحت الحجاب والحاجز، وذلك يعيق تمدد حركة الرئتين، كما يقلل من حركة الحجاب الحاجز فتقل كمية الهواء التي يحصلون عليها..\nوبعض الأبحاث أثبتت أن هناك علاقة بين السمنة، ولا سيما سمنة البطن \" الكرش\" والإصابة بالعقم عند السيدات ، فقد وُجد أن هناك زيادة في تراكم الدهون حول المبيض وقناة فالوب، مما يؤثر على عملية التبويض والإنجاب.\nإن أفضل وأبسط طرق التخلص من الكرش هي :\nأولا : يجب المداومة على أداء الصلاة، وفيها يستطيع الإنسان حرق 580 سعرا حراريا على الأقل، فالله سبحانه وتعالي ورسولنا الكريم صلي الله عليه وسلم لم يأمرنا بأوامر إلا وفيها ما يفيد البشر من الناحية الروحية والصحية \nثانيا : أن نبدأ فوراً بتغيير واستبدال العادات الغذائية السيئة بعادات جديدة سليمة وصحيحة تعتمد على التكامل بين الركائز الغذائية الأساسية التي تبني جسم الإنسان مثل السكريات والبروتينات والنشويات وكذلك في تناول الدهون وليس منعها وتناول الألياف الغذائية بنسبة لا تقل عن 40 -60% من الوجبة الغذائية.\nثالثا : احرص واحرصي على :\nتناول \" جريب فروت\" قبل تناول الطعام يقلل من إحساسك بالجوع.\nابدأ طعامك بتناول السلطات الخضراء المضاف إليها ملعقتا خل ليعطيك ذلك إحساسا بالشبع لفترة طويلة.\nاحرص على تناول الأغذية الغنية بالألياف فهي تأخذ وقتا أطول في المضغ مما يقلل الإحساس بالجوع وتخفف من حدوث الإمساك.\nقلل كمية الملح في الأكل لأن كثرته تمنع طرح السوائل الزائدة في الجسم مما يزيد من محيط خصرك، علما أن الجسم لا يحتاج من الملح أكثر من ملعقة شاي واحدة يوميا \" 4 جرامات\".\nتناول ال.ادي 3 مرات في الأسبوع يحقق نتائج جيدة ويسهم في تخفيف \" الكرش\" لأنه يحتوي على بكتيريا \" اللاكتوباسيلس اسيدوفيلس\" التي تؤدي إلى تخمرّ اللبن ، كما يحتوي على إنزيم \" اللاكتيز\" الهاضم لسكر\" اللاكتوز\" الموجود في اللبن ، وهو الإنزيم الذي يفقده 85% من الناضجين خاصة في الشعوب العربية والإفريقية، ويتسبب نقصه في سوء الهضم واضطرابات الأمعاء والانتفاخ.\nوأشارت الدراسة أيضا إلى أن ال.ادي يزيد من قدرة الجسم على حرق الدهون الزائدة مما يجعله يفقد هذه الدهون ويحتفظ بالعضلات.\nرابعا : شرب ثلاثة أكواب من الماء قبل الوجبات الرئيسية ، فهو يملأ المعدة ويقلل تناول الطعام، و ليس له سعرات حرارية. وعدم شرب السوائل الباردة مع الأكل أو بعده مباشرة\nخامسا : يوصى بارتداء حزام حول البطن لتصغير حجم المعدة (تحزيم من الخارج بدل عملية تحزيم المعدة) وممارسة تمرينات شد البطن وتقوية الظهر بالإضافة إلى الانتباه لشد الجسم والمحافظة على شكل القوام.\nسادسا : تناول الطعام ببطء لأكثر من عشرين دقيقة، فستشعر بالشبع بسرعة دون أن تملأ معدتك بالكثير من الطعام لأن الأكل السريع يملأ المعدة بالكثير من الطعام قبل الإحساس بالشبع.\nسابعا : عليك الالتزام بممارسة التمارين الرياضية، فمن الممكن أن تكون عضلات البطن ضعيفة وتحتاج إلى التقوية،. ويمكن في هذا الشأن الاستعانة بالأجهزة المنزلية حيث تحرز نتيجة هائلة. بالإضافة الى رياضة المشي، حيث ان المشي كل 10 كيلو مترات يساعد على حرق 800وحدة حرارية، فمن خلال الرياضة تستطيع أن تقضي على الكرش نهائياً\n", "i_order": 6, "days": [{"s_name": "اليوم الاول ", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "rm_fruit", "s_name": "2 ثمرة فاكهة متنوعة ( ما عدا التين، العنب، البلح، الموز، والمانجو ) ويفضّل كوب عصير برتقال أو جريب فروت", "i_calories": 0, "i_order": 1}, {"s_icon": "rm_water", "s_name": "سوائل : شاي، أو قهوة، أو صودا، أو ماء ليمون بدون سكر", "i_calories": 0, "i_order": 2}]}, {"s_name": "الغداء", "i_order": 2, "list": [{"s_icon": "rm_salad", "s_name": "طبق سلطة خصراء", "i_ca يتامينات: إذا كنت تشعرين بجوع حقيقي فمن الممكن أن يكون جسمك يفتقد بعض المواد الغذائية، لذلك تناول الفيتامينات قد يعوض هذا النقص بدون الحاجة لتناول كميات إضافية من الطعام.\nتناولي الوجبات الخفيفة: الوجبات الخفيفة ذات السعرات المنخفضة تساهم كثيرا في التخفيف من شعورك بالجوع. ضعي إلى جانبك الكثير من الخضار النيئة و الفواكه حيث أنها لا تحتوي على سعرات عالية كما أنها تحتوي على ألياف مما يشعرك بالشبع.\nتريثي قبل الأكل: إذا شعرت بنوبة جوع مفاجئ انتظري لمدة عشرة دقائق، لأن نوبة الجوع قد تختفي بنفس السرعة التي ظهرت بها، إضافة إلى ذلك اشربي المياه حيث لا تعودين تشعرين بأنك بحاجة إلى الأكل.\nوكنصائح عامة يمكنك البدء بتطبيقها من الآن إذا كنت تحلمين بقوام رشيق، عليك اتباع هذه التعليمات للوصول إلى غايتك في الرشاقة: \nاشرب الماء في كل وقت وبأي كمية ممكنة فهي أسرع وأسهل وارخص طريقة للتقليل من الشهية وبالتالي تقليل استهلاك كميات الطعام.\nلا تبقي خزائن المطبخ ممتلئة بالأطعمة. فهي أسهل طريقة لتوفير النقود وكذلك تقليل كمية الأكل التي يتم تناولها خلال اليوم كون خيارات الأكل سوف تتقلص بتقلص كمية الأكل المعروضة أمامك.\nابتكر أساليب جديدة لتحفزك على التقليل من الأكل. مثل تعليق صورة فستان أو أي نوع من الملابس وحاول الوصول إلى الوزن المناسب حتى تستطيع شراءه.\nاحصل على ساعات من النوم تكون كافية. فقد أثبت الدراسات أن النوم يزيد من نسبة الهضم والحرق بالإضافة إلى أنك لا تستهلك أي مأكولات خلال ساعات نومك.\nاضبط مشترياتك. لا تذهب للتسوق إلا بعد إعداد قائمة مسبقة بحيث لا تشتري ما يزيد عن حاجاتك كذلك ابقي عربة التسوق في بداية الممر حتى تقوم بحمل مشترياتك أطول مسافة حتى تقوم بحرق أكبر كمية من الدهون.\nتناول الإفطار باستمرار: فهو يزودك بالطاقة طوال اليوم وكذلك فإنك لن تشعر بجوع شديد عند تناول وجبة الغداء.\nاشرب الشاي الأخضر: أثبتت دراسة سويسرية أن تناول الشاي الأخضر يحفز الجسم لحرق الدهون بشكل أكبر لذلك ينصح بشرب 3 أكواب شاي أخضر في اليوم على الأقل.\nركز في كل ما تأكل: أي لا تتناول الأطعمة أثناء مشاهدة التلفاز أو أثناء القراءة لأنك ستتناول الكثير دون أن تشعر.\nاشتري أوزان للتمرين: ابدأ بأوزان خفيفة ولمدة قصيرة في منزلك.\nاعمل في حديقتك: قم بأعمال الحديقة مثل زرع نباتات جديدة أو ري المزروعات فذلك يساعد على حرق الدهون.\nقم بالأعمال المنزلية : فالقيام بهذه الأعمال يحرك كل عضلات الجسم وينشطها بحيث تستهلك سعرات حرارية أكبر\n\n  ملاحظة\nالغذاء البديل: يمكنك استبدال أي غذاء بهذا الغذاء\n30 غرام جبنه خالية من الدسم - ملعقة لبنة - فواكه مقطعة - قهوة أو شاي - شرب الماء بشكل معتدل.", "i_order": 9, "days": [{"s_name": "اليوم الاول ", "i_order": 1, "meals": [{"s_name": "الوجبات لهذا اليوم", "i_order": 1, "list": [{"s_icon": "", "s_name": "نصف كوب كريب فروت - قطعة خبز اسمر - فنجان شاي (سكر صناعي) سلطة دجاج - قطعة خبز اسمر - قهوة أو شاي 110 غرام سمك\nمشوي - سلطة خضار - نصف كوب كريب فروت", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثاني ", "i_order": 2, "meals": [{"s_name": "الوجبات لهذا اليوم", "i_order": 1, "list": [{"s_icon": "", "s_name": "نصف كوب كريب فروت - قطعة خبز اسمر - فنجان شاي (سكر صناعي) سلطة تونة بدون زيت مع الحامض - خس - تفاحة - قهوة أو شاي يخنة اللحم - لوبيا مسلوقة - سلطة خضار - قهوة أو شاي", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثالث ", "i_order": 3, "meals": [{"s_name": "الوجبات لهذا اليوم", "i_order": 1, "list": [{"s_icon": "", "s_name": "نصف كوب كريب فروت - قطعة خبز اسمر - فنجان شاي سكر صناعي بيضتان مسلوقة - 30 غرام جبنه قليلة الدسم - قطعة خبز اسمر- شاي قطعة دجاج مشوي دون جلد - سبانخ سوتيه - شاي أو قهوة\t", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الرابع ", "i_order": 4, "meals": [{"s_name": "الوجبات لهذا اليوم", "i_order": 1, "list": [{"s_icon": "", "s_name": "نصف كوب كريب فروت - قطعة خبز اسمر - فنجان شاي سكر صناعي قالب الجبنة مع السبانخ - تفاحة - قهوة أو شاي سمك مشوي - سلطة خضار - قطعة خبز اسمر - قهوة أو شاي", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الخامس ", "i_order": 5, "meals": [{"s_name": "الوجبات لهذا اليوم", "i_order": 1, "list": [{"s_icon": "", "s_name": "نصف كوب كريب فروت - قطعة خبز اسمر - فنجان شاي (سكر صناعي) سلطة خس - سلطة فواكه - قهوة أو شاي 200 غرام دجاج في الفرن - سلطة طماطم - كريب فروت- قهوة أو شاي", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم السادس ", "i_order": 6, "meals" function renderTip(planIndex, dayNo){
  const lineEl = document.getElementById("tipLine");
  const moreEl = document.getElementById("tipMore");
  const btnEl  = document.getElementById("tipMoreBtn");
  if(!lineEl || !moreEl || !btnEl) return;

  const safeDay = Math.max(1, Number(dayNo)||1);
  const idx = (Number(planIndex||0) * 37 + (safeDay-1)) % TIPS.length;
  const tip = TIPS[idx];

  lineEl.textContent = `نصيحة اليوم: ${tip.t}`;
  moreEl.textContent = tip.d;

  btnEl.onclick = () => {
    const open = moreEl.style.display === "block";
    moreEl.style.display = open ? "none" : "block";
    btnEl.textContent = open ? "المزيد" : "إخفاء";
  };
}

const LS_KEY = "dietapp_startdate_v2";
const LS_PLAN = "dietapp_plan_v2";
const LS_OFFSET = "dietapp_offset_v2";
const LS_DESCOPEN = "dietapp_descopen_v3";

function fmtDate(d){
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  return `${dd}-${mm}-${yyyy}`;
}

function todayLocal(){
  const d=new Date();
  d.setHours(0,0,0,0);
  return d;
}

function getStartDate(){
  const v=localStorage.getItem(LS_KEY);
  if(!v) return null;
  const d=new Date(v);
  if(isNaN(d.getTime())) return null;
  d.setHours(0,0,0,0);
  return d;
}

function setStartDate(d){
  d.setHours(0,0,0,0);
  localStorage.setItem(LS_KEY, d.toISOString());
}

function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

    const items = [];
    (sec.list||[]).forEach(it=>{
      const txt = (it.s_name||"").trim();
      if(txt) items.push(txt);
    });
    out.push({title: secTitle, items});
  });
  return out;
}


function mealTypeFromTitle(title){
  const t = (title||"").toString().trim();
  if(!t) return "generic";
  if(t.includes("الإفطار") || t.toLowerCase().includes("breakfast")) return "breakfast";
  if(t.includes("الغداء") || t.toLowerCase().includes("lunch")) return "lunch";
  if(t.includes("العشاء") || t.toLowerCase().includes("dinner")) return "dinner";
  if(t.includes("سناك") || t.includes("وجبة خفيفة") || t.includes("تصبيرة") ) return "snack";
  return "generic";
}

function render(){
  const planIndex = Number(localStorage.getItem(LS_PLAN) || 0);
  const plan = PLANS[clamp(planIndex,0,PLANS.length-1)];
  const planDays = plan.days || [];
  document.getElementById("planTitle").textContent = plan.s_name || "الرجيم";
  const metaEl = document.getElementById("planMeta");
  const descEl = document.getElementById("planDesc");
  const infoBtn = document.getElementById("infoBtn");

  const daysTxt = `عدد الأيام: ${plan.i_days || planDays.length}`;
  const targetTxt = plan.s_target ? `
الهدف: ${plan.s_target}` : "";
  metaEl.textContent = `${daysTxt}${targetTxt}`;

  const descTxt = plan.s_description ? `تعليمات (Anleitung)\n${plan.s_description}` : "";
  if(descTxt){
    descEl.textContent = descTxt;
    infoBtn.style.display = "";
    const open = (localStorage.getItem(LS_DESCOPEN) || "0") === "1";
    descEl.style.display = open ? "block" : "none";
    infoBtn.textContent = open ? "إخفاء معلومات الرجيم" : "معلومات الرجيم";
  } else {
    descEl.textContent = "";
    descEl.style.display = "none";
    infoBtn.style.display = "none";
  }

  const start = getStartDate();
  const offset = Number(localStorage.getItem(LS_OFFSET) || 0);
  const now = todayLocal();
  document.getElementById("today").textContent = `اليوم: ${fmtDate(now)}`;

  let dayNo = 1;
  let startTxt = "تاريخ البداية: غير محدد";
  if(start){
    const diff = Math.round((now - start) / (1000*60*60*24));
    dayNo = diff + 1 + offset;
    startTxt = `تاريخ البداية: ${fmtDate(start)}`;
  } else {
    dayNo = 1 + offset;
  }
  dayNo = clamp(dayNo, 1, planDays.length || 1);
  document.getElementById("dayNo").textContent = `اليوم رقم (Tag): ${dayNo} / ${planDays.length||plan.i_days||"?"}`;
  document.getElementById("startInfo").textContent = startTxt;

  

  const progressEl = document.getElementById("progressLine");
  if(progressEl){
    if(start){
      progressEl.textContent = `أنت في اليوم ${dayNo} من الرجيم منذ تاريخ البداية`;
    } else {
      progressEl.textContent = `حدد تاريخ البداية ثم اضغط ابدأ من اليوم لمعرفة اليوم الحالي`;
    }
  }
const dayObj = planDays[dayNo-1] || {s_name:`اليوم ${dayNo}`, meals:[]};
  document.getElementById("dayTitle").textContent = (dayObj.s_name||`اليوم ${dayNo}`).trim();

  const totalDays = planDays.length || 1;
  const pct = Math.max(0, Math.min(1, dayNo / totalDays));
  const pctTxt = Math.round(pct * 100) + "%";
  const pt = document.getElementById("dayProgText");
  const pp = document.getElementById("dayProgPct");
  const pf = document.getElementById("dayProgFill");
  if(pt) pt.textContent = `اليوم ${dayNo} من ${totalDays}`;
  if(pp) pp.textContent = pctTxt;
  if(pf) pf.style.width = pctTxt;

  const box = document.getElementById("mealBox");
  box.innerHTML = "";
  const sections = flattenMeals(dayObj);
  if(sections.length===0){
    box.innerHTML = "<div class='small'>لا توجد بيانات لهذا اليوم</div>";
    return;
  }
  sections.forEach(sec=>{
    const wrap = document.createElement("div");
    wrap.className = "mealSection";
    const mt = mealTypeFromTitle(sec.title);
    wrap.classList.add("meal-"+mt);
    const h = document.createElement("div");
    h.className = "mealTitle";
    h.style.fontWeight = "800";
    h.textContent = sec.title || "الوجبات";
    wrap.appendChild(h);

    const timeMap = {
      breakfast: "06:00 - 10:00",
      lunch: "12:00 - 15:00",
      dinner: "18:00 - 21:00",
      snack: "10:00 - 11:30"
    };
    const tr = timeMap[mt];
    if(tr){
      const tdiv = document.createElement("div");
      tdiv.className = "small";
      tdiv.style.marginTop = "4px";
      tdiv.textContent = `الوقت: ${tr}`;
      wrap.appendChild(tdiv);
    }

    if(sec.items.length===0){
      const p=document.createElement("div");
      p.className="small";
      p.textContent="لا يوجد محتوى";
      wrap.appendChild(p);
    } else {
      const ul=document.createElement("ul");
      sec.items.forEach(t=>{
        // split lines into bullets if multiple lines
        t.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
          const li=document.createElement("li");
          li.textContent=line;
          ul.appendChild(li);
        });
      });
      wrap.appendChild(ul);
    }
    box.appendChild(wrap);
    box.appendChild(document.createElement("hr"));
  });
  // remove last hr
  const hrs = box.querySelectorAll("hr");
  if(hrs.length) hrs[hrs.length-1].remove();

  // Tip of the day
  renderTip(planIndex, dayNo);
}

function renderWeights(){
  const tbody = document.querySelector("#wTable tbody");
  const stats = document.getElementById("wStats");
  if(!tbody) return;
  const arr = wLoad().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  tbody.innerHTML = "";
  if(arr.length===0){
    if(stats) stats.textContent = "لا توجد قياسات بعد";
    return;
  }
  const latest = arr[0];
  const oldest = arr[arr.length-1];
  const delta = (parseFloat(latest.w) - parseFloat(oldest.w));
  const deltaTxt = isFinite(delta) ? (delta>0? `زيادة ${delta.toFixed(1)} kg` : `نقص ${Math.abs(delta).toFixed(1)} kg`) : "";
  if(stats) stats.textContent = `آخر وزن ${latest.w} kg بتاريخ ${latest.date}` + (deltaTxt? `   التغير منذ أول قياس   ${deltaTxt}`:"");

  for(const it of arr){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${it.date||""}</td>
      <td>${it.w||""}</td>
      <td>${(it.note||"")}</td>
      <td>
        <button class="iconBtn" data-del="${it.id}" aria-label="حذف">✕</button>
      </td>`;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.getAttribute("data-del");
      const next = wLoad().filter(x=> String(x.id)!==String(id));
      wSave(next);
      renderWeights();
      drawWChart();
    });
  });
}

function drawWChart(){
  const c = document.getElementById("wChart");
  if(!c) return;
  const ctx = c.getContext("2d");
  const arr = wLoad().sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  const w = c.width = c.clientWidth * (window.devicePixelRatio||1);
  const h = c.height = 140 * (window.devicePixelRatio||1);
  ctx.clearRect(0,0,w,h);

  if(arr.length<2){
    ctx.globalAlpha = .7;
    ctx.font = `${14*(window.devicePixelRatio||1)}px system-ui`;
    ctx.fillText("أضف قياسين على الأقل لرسم الخط", 16*(window.devicePixelRatio||1), 40*(window.devicePixelRatio||1));
    ctx.globalAlpha = 1;
    return;
  }
  const ws = arr.map(x=>parseFloat(x.w)).filter(x=>isFinite(x));
  if(ws.length<2) return;
  const minW = Math.min(...ws), maxW = Math.max(...ws);
  const pad = 18*(window.devicePixelRatio||1);
  const X0=pad, Y0=pad, X1=w-pad, Y1=h-pad;

  // grid
  ctx.globalAlpha = .35;
  ctx.lineWidth = 1*(window.devicePixelRatio||1);
  ctx.beginPath();
  for(let i=0;i<=3;i++){
    const y = Y0 + (Y1-Y0)*(i/3);
    ctx.moveTo(X0,y); ctx.lineTo(X1,y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // line
  const denom = (maxW-minW) || 1;
  const n = arr.length;
  ctx.lineWidth = 3*(window.devicePixelRatio||1);
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const x = X0 + (X1-X0)*(i/(n-1));
    const y = Y1 - (Y1-Y0)*((parseFloat(arr[i].w)-minW)/denom);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = "rgba(37,99,235,.95)";
  ctx.stroke();

  // points
  ctx.fillStyle = "rgba(22,163,74,.95)";
  for(let i=0;i<n;i++){
    const x = X0 + (X1-X0)*(i/(n-1));
    const y = Y1 - (Y1-Y0)*((parseFloat(arr[i].w)-minW)/denom);
    ctx.beginPath(); ctx.arc(x,y,4*(window.devicePixelRatio||1),0,Math.PI*2); ctx.fill();
  }

  // labels
  ctx.fillStyle = "rgba(15,23,42,.75)";
  ctx.font = `${12*(window.devicePixelRatio||1)}px system-ui`;
  ctx.fillText(`${maxW.toFixed(1)} kg`, X0, Y0-6*(window.devicePixelRatio||1));
  ctx.fillText(`${minW.toFixed(1)} kg`, X0, Y1+14*(window.devicePixelRatio||1));
}

function wExport(){
  const data = wLoad();
  const blob = new Blob([JSON.stringify({weights:data}, null, 2)], {type:"application/json"});

}
function wImport(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const obj = JSON.parse(String(r.result||"{}"));
      const arr = (obj.weights||obj||[]);
      if(Array.isArray(arr)){
        const norm = arr.map(x=>({id:x.id||Date.now()+Math.random(), date:x.date||"", w:x.w||x.weight||"", note:x.note||""}))
                        .filter(x=>x.date && x.w);
        wSave(norm);
        renderWeights();
        drawWChart();
      }
    }catch(e){}
  };
  r.readAsText(file);
}

      const ls = obj.localStorage || obj;
      if(ls && typeof ls === "object"){
        Object.keys(ls).forEach(k=>{

function bmiCalc(){
  const h = num(document.getElementById("inH").value);
  const w = num(document.getElementById("inW").value);
  const a = num(document.getElementById("inA").value);
  const s = document.getElementById("inS").value;

  const out = document.getElementById("bmiOut");
  if(!h || !w){
    out.textContent = "أدخل الطول والوزن";
    return;
  }

  const hm = h/100;
  const bmi = w/(hm*hm);

  const wMin = 18.5 * hm * hm;
  const wMax = 24.9 * hm * hm;
  const wIdeal = 22 * hm * hm;

  const bmiTxt = bmi.toFixed(1);
  const wMinTxt = wMin.toFixed(1);
  const wMaxTxt = wMax.toFixed(1);
  const wIdealTxt = wIdeal.toFixed(1);

  let cat = "طبيعي";
  if(bmi < 18.5) cat = "نحافة";
  else if(bmi < 25) cat = "طبيعي";
  else if(bmi < 30) cat = "زيادة وزن";
  else cat = "سمنة";

  let bmrLine = "";
  if(a){
    let bmr = (s==="m")
      ? (10*w + 6.25*h - 5*a + 5)
      : (10*w + 6.25*h - 5*a - 161);
    bmrLine = `${Math.round(bmr)} kcal`;
  }

  const minB = 15;
  const maxB = 40;
  const pct = Math.max(0, Math.min(100, ((bmi - minB) / (maxB - minB)) * 100));

  out.innerHTML = `
    <div class="bmiBar" aria-label="مؤشر BMI">
      <div class="bmiMarker" style="left:${pct}%;"></div>
    </div>
    <div class="bmiLegend"><span>${minB}</span><span>18.5</span><span>24.9</span><span>30</span><span>${maxB}+</span></div>

    <div style="margin-top:10px">
      <div class="bmiLine"><span>BMI</span><span>${bmiTxt} (${cat})</span></div>
      <div class="bmiLine"><span>نطاق وزن طبيعي</span><span>${wMinTxt} إلى ${wMaxTxt} kg</span></div>
      <div class="bmiLine"><span>وزن هدف تقريبي</span><span>${wIdealTxt} kg</span></div>
      ${a ? `<div class="bmiLine"><span>حرقك اليومي التقريبي BMR</span><span>${bmrLine}</span></div>` : ``}
    </div>
  `;
}

<script>
/* ===================================================================
   أنظمة مُضافة — تُلحَق بالقائمة الأصلية ولا تعدّلها.
   الأنظمة الأصلية تبقى كما هي بترتيبها ومحتواها.

(function(){

_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "سلطة تبولة + جبنة Hüttenkäse 150غ (≈420 سعرة)", "i_calories": 0, "i_order": 1}]}]}]}, {"s_name": "نظام الكيتو", "s_target": "إدخال الجسم في الحالة الكيتونية لحرق الدهون — نحو 1600 سعرة يوميًا وأقل من 50غ كربوهيدرات.", "i_days": 7, "s_description": "نظام منخفض الكربوهيدرات عالي الدهون، مكتوب وفق النِّسب المعتمدة في المصادر العلمية:\nدهون 70–80% من السعرات · بروتين 10–20% · كربوهيدرات 5–10% أي أقل من 50 غرامًا يوميًا، ويصل بعضهم إلى 20 غرامًا.\nالمرجع: مراجعة جامعة هارفارد لنظام الكيتو (The Nutrition Source).\n\n*** الأوقات:\nالإفطار 06:00–10:00 · الغداء 12:00–15:00 · العشاء 18:00–21:00. السعرات اليومية هنا نحو 1600.\n\n*** مسموح:\nزيت زيتون وزبدة وسمنة، أفوكادو، مكسّرات وبذور، أجبان صلبة، لحوم وأسماك وبيض، خضار غير نشوية (خيار، سبانخ، بروكلي، كوسا، قرنبيط، فلفل)، كمية صغيرة من التوت.\n\n*** ممنوع:\nالخبز والأرز والبرغل وكل الحبوب، البطاطا والذرة، معظم الفواكه والعصائر، البقوليات (عدس، حمص، فول، فاصولياء)، السكر بكل أشكاله.\nانتبه: هذا يعني أن أكلاتنا الشامية الأساسية — المجدّرة والحمص والفول والمحاشي — خارج النظام.\n\n*** المشتريات في ألمانيا:\nمن ليدل/ألدي: Eier، Butter، Olivenöl، Avocado، Lachs، Makrele، Sardinen، Hähnchenschenkel، Rindersteak، Gouda/Cheddar، Mozzarella، Sahne، Frischkäse، Walnüsse، Mandeln، Oliven، Blumenkohl، Brokkoli، Zucchini، Spinat، Gurke، Rucola، Beeren (TK).\nمن المحل العربي: جبنة بيضاء قليلة الملح، زيتون، طحينة بكمية قليلة.\n\n*** ماذا تتوقّع:\nفي الأيام 2–5 قد تشعر بصداع وتعب وإمساك — تُعرف بـ«نزلة الكيتو». أكثِر من الماء والملح والخضار الورقية.\nفقدان الوزن في الأسبوع الأول معظمه ماء لا دهون.\nالأدلة تشير إلى أن الفرق عن الحميات التقليدية بعد سنة يكاد يختفي، وأن الالتزام يصعب مع الوقت.\n\n*** لا تتبعه إن كنت:\nمريض سكري من النوع الأول، أو تتناول دواء سكري أو إنسولين (خطر هبوط السكر — يلزم تعديل الجرعات بإشراف طبيب)، أو لديك مرض كلى أو كبد أو حصى كلوية أو نقرس، أو حامل أو مرضع، أو دون الثامنة عشرة.\nيُعاد النظام من اليوم الأول بعد انتهاء الأسبوع.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. صِيغ استنادًا إلى إرشادات منشورة من جهات موثوقة، وهو قالب عام لا خطة شخصية.\nاستشر طبيبك أو اختصاصي التغذية قبل البدء، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان، أوقف النظام وراجع طبيبك.\n", "i_order": 101, "days": [{"s_name": "اليوم الاول", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "بيضتان مقليتان بالزبدة + نصف أفوكادو + قهوة بلا سكر (≈430 سعرة · 5غ كربوهيدرات)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 2, "list": [{"s_icon": "", "s_name": "سلطة دجاج: فخذ دجاج مشوي 150غ + جرجير وخيار + ملعقتا زيت زيتون (≈590 سعرة · 6غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 3, "list": [{"s_icon": "", "s_name": "سمك لاكس مشوي 150غ + بروكلي بالزبدة (≈560 سعرة · 7غ)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثاني", "i_order": 2, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "عجّة بالجبنة: بيضتان + جبنة غودا 30غ + سبانخ (≈400 سعرة · 4غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 2, "list": [{"s_icon": "", "s_name": "ستيك لحم 150غ + سلطة خضراء بزيت الزيتون + زيتون (≈620 سعرة · 6غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 3, "list": [{"s_icon": "", "s_name": "أرز القرنبيط مقلي بالزبدة + بيضة + كوسا (≈540 سعرة · 10غ)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثالث", "i_order": 3, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "لبنة كاملة الدسم 3 ملاعق + زيت زيتون + خيار (≈380 سعرة · 5غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 2, "list": [{"s_icon": "", "s_name": "سردين معلّب بالزيت علبتان + سلطة جرجير وبندورة قليلة (≈600 سعرة · 5غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_ alories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 2, "list": [{"s_icon": "", "s_name": "ستيك دجاج 160غ + سلطة كبيرة بزيت الزيتون والليمون (≈590 سعرة · 6غ)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 3, "list": [{"s_icon": "", "s_name": "بيض بالزبدة + نصف أفوكادو + توت مجمّد ربع كوب (≈560 سعرة · 11غ)", "i_calories": 0, "i_order": 1}]}]}]}, {"s_name": "حمية البحر المتوسط", "s_target": "نمط غذائي طويل الأمد يحمي القلب ويُنقص الوزن تدريجيًا — نحو 1600 سعرة يوميًا.", "i_days": 7, "s_description": "نمط غذائي لا حمية قاسية، وهو الأقوى دليلًا علميًا بين كل ما في هذا التطبيق.\n\n*** لماذا أنصح به:\nفي دراسة على نحو 26 ألف امرأة انخفض خطر أمراض القلب نحو 25%، ومراجعة شاملة ربطت الالتزام العالي بانخفاض خطر القلب 24% والوفاة المبكرة 23%. في تجربة PREDIMED انخفضت الوفاة بالسكتة الدماغية نحو 30% مع زيت الزيتون البكر أو المكسّرات، وقلّ خطر السكري من النوع الثاني.\nالمرجع: مراجعة جامعة هارفارد لحمية البحر المتوسط (The Nutrition Source).\nلإنقاص الوزن يلزم ضبط الكمية أيضًا — وهذا ما فعلتُه هنا: نحو 1600 سعرة يوميًا.\n\n*** قواعده:\nزيت الزيتون هو الدهن الأساسي بدل الزبدة والسمنة.\nخضار وفواكه وبقوليات وحبوب كاملة يوميًا.\nسمك مرتان أسبوعيًا على الأقل، ويفضَّل الدهني كالسلمون والسردين.\nدجاج وبيض وألبان بكميات صغيرة.\nلحم أحمر بضع مرات في الشهر فقط.\nالماء هو الشراب الأساسي.\nحركة يومية ممتعة — جزء من النمط لا إضافة عليه.\n\n*** ميزته لك:\nقريب جدًا من المطبخ الشامي أصلًا: زيت زيتون، برغل، عدس، حمّص، خضار، سمك، زعتر. لا يطلب منك التخلّي عن طعامك، بل ضبط نِسبه.\n\n*** المشتريات في ألمانيا:\nمن ليدل/ألدي: Olivenöl nativ extra، Lachs، Sardinen، Thunfisch، Linsen، Kichererbsen، Vollkornbrot، Haferflocken، Naturjoghurt، Walnüsse، Mandeln، Tomaten، Gurken، Paprika، Zwiebeln، Knoblauch، Spinat، Brokkoli، Orangen، Äpfel، Beeren.\nمن المحل العربي/التركي: برغل، فريكة، زعتر، طحينة، زيتون، جبنة بيضاء، خبز أسمر.\n\n*** ملاحظة أمينة:\nمعظم أدلّة هذا النمط من دراسات رصدية لا تجارب محكومة، وهي تُظهر ارتباطًا قويًا لا سببية قاطعة. ومع ذلك يبقى الأفضل سجلًّا من حيث السلامة وطول الأمد.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. صِيغ استنادًا إلى إرشادات منشورة من جهات موثوقة، وهو قالب عام لا خطة شخصية.\nاستشر طبيبك أو اختصاصي التغذية قبل البدء، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان، أوقف النظام وراجع طبيبك.\n", "i_order": 102, "days": [{"s_name": "اليوم الاول", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "شوفان 50غ + زبادي طبيعي + توت + 6 جوزات (≈380 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "تفاحة (≈80 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "شوربة عدس + سلطة خضراء بزيت الزيتون + نصف رغيف أسمر (≈540 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "سمك سردين معلّب + سلطة بندورة وخيار وبصل بزيت الزيتون + خبز أسمر (≈520 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثاني", "i_order": 2, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "خبز أسمر + زيت زيتون وزعتر + بندورة + شاي (≈360 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "زبادي طبيعي كوب (≈110 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "حمّص حبّ بالبندورة وزيت الزيتون + برغل 50غ + سلطة (≈560 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "بيضتان + سلطة جرجير وبندورة + نصف رغيف (≈480 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثالث", "i_order": 3, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "زبادي + ملعقة عسل + لوز 10 حبات (≈330 سعرة  "i_calories": 0, "i_order": 1}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "توت أو فراولة كوب (≈60 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "يخنة فاصولياء بزيت الزيتون + أرز بسمتي 40غ (≈550 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "سمك مشوي 150غ + سلطة خضراء كبيرة + ليمون (≈490 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم السابع", "i_order": 7, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "شوفان + جوز + تفاحة مبشورة (≈380 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "زبادي (≈110 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "محشي كوسا بالأرز والخضار (بلا لحم) + لبن (≈540 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "عجّة بالبقدونس والبصل + سلطة + نصف رغيف أسمر (≈480 سعرة)", "i_calories": 0, "i_order": 1}]}]}]}, {"s_name": "رجيم ألماني سريع", "s_target": "نصف إلى كيلو واحد أسبوعيًا بأطعمة ألمانية رخيصة ومتوفّرة — نحو 1450 سعرة يوميًا.", "i_days": 14, "s_description": "رجيم ألماني عملي من أطعمة تجدها في أي سوبرماركت هنا، وبإيقاع سريع لكنه آمن.\n\n*** كم ينقص الوزن فعلًا:\nنصف كيلو إلى كيلو في الأسبوع. وأقول لك بصراحة مهنية: كل من يَعِدُك بأكثر من ذلك يبيعك ماءً وكتلة عضلية لا دهنًا. السعرات هنا نحو 1450 يوميًا، وهذا أسرع إيقاع يبقى آمنًا بلا إشراف طبي.\n\n*** على ماذا بُني:\nعلى القواعد العشر للجمعية الألمانية للتغذية (Deutsche Gesellschaft für Ernährung – DGE)، وهي المرجع الرسمي في ألمانيا:\n• خمس حصص يوميًا: ثلاث خضار وحصّتان فاكهة (5 am Tag).\n• الحبوب الكاملة دائمًا بدل الأبيض (Vollkorn).\n• حليب ومشتقاته يوميًا، وسمك مرة إلى مرتين أسبوعيًا (Fisch 1–2 mal pro Woche).\n• اللحم 300 إلى 600 غرام في الأسبوع كله، لا أكثر.\n• زيوت نباتية مثل زيت اللفت (Rapsöl) بدل الدهون الحيوانية.\n• ملح 6 غرامات يوميًا كحد أقصى، ويفضَّل المعالج باليود (Jodsalz).\n• ماء لتر ونصف يوميًا (Wasser), أو شاي بلا سكر.\n• حركة 30 إلى 60 دقيقة يوميًا: مشي أو دراجة (Spazieren oder Radfahren).\n\n*** سرّ هذا الرجيم — البروتين الألماني الرخيص:\nجبنة هارتسر (Harzer Käse): 100 غرام فيها نحو 30 غرام بروتين وأقل من غرام دهن، وسعرها أقل من يورو. هي الحيلة التي يعرفها كل من جرّب الرجيم في ألمانيا.\nكوارك خالي الدسم (Magerquark) وسكير (Skyr): بروتين عالٍ وشبع طويل.\nخبز الشوفان المقرمش (Knäckebrot) وخبز البومبرنيكل (Pumpernickel): ألياف عالية وسعرات قليلة.\n\n*** الأوقات:\nالفطور (Frühstück) 06:00–10:00 · وجبة خفيفة (Zwischenmahlzeit) 10:00–11:30 · الغداء (Mittagessen) 12:00–15:00 · العشاء (Abendbrot) 18:00–21:00.\nالعشاء الألماني بارد وخفيف عادةً، وهذا يناسب إنقاص الوزن.\n\n*** قائمة المشتريات (Einkaufsliste):\nألبان وبروتين: Harzer Käse، Magerquark، Skyr، Körniger Frischkäse، Buttermilch، Eier، Hähnchenbrustfilet، Putenbrust، Seelachsfilet، Kabeljau، Forelle، Matjes، Räucherlachs، Thunfisch.\nخبز وحبوب: Vollkornbrot، Pumpernickel، Knäckebrot، Haferflocken، Vollkornnudeln.\nخضار: Sauerkraut، Grünkohl، Rotkohl، Kohlrabi، Spargel، Rote Bete، Möhren، Gurke، Tomaten، Radieschen، Kartoffeln، Zwiebeln، Tiefkühl-Gemüse.\nبقوليات وشوربات: Linsen، Erbsen، Bohnen (لعمل Linsensuppe و Erbsensuppe و Eintopf).\nفواكه: Äpfel، Birnen، Beeren، Orangen.\nدهون: Rapsöl، Leinöl، Olivenöl.\n\n*** قواعد لا تكسرها:\nلا مشروبات سكرية ولا عصائر — ماء وشاي وقهوة بلا سكر فقط.\nلا أكل بعد العشاء إطلاقًا.\nالخبز يُوزن: شريحة Vollkornbrot نحو 50 غرامًا و110 سعرات.\nامشِ نصف ساعة يوميًا على الأقل — بلا حركة يتباطأ النزول بعد الأسبوع الأول.\nيُعاد النظام من اليوم الأول بعد انتهاء الأسبوعين، أو انتقل إلى حمية البحر المتوسط للمحافظة.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. صِيغ استنادًا إلى قواعد الجمعية الألمانية للتغذية، وهو قالب عام لا خطة شخصية.\nاستشر طبيبك قبل البدء إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض كلى أو كبد، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان، أوقف النظام وراجع طبيبك.\n", "i_order": 103, "days": [{"s_name": "اليوم الاول", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "شوفان (Haferflocken) 40غ مطبوخ بالماء + نصف تفاحة مبشورة + قرفة (≈260 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "قهوة أو شاي بلا سكر", "i_calories": 0, "i_order": 2}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "كوارك خالي الدسم (Magerquark) 150غ + حفنة توت (Beeren) (≈130 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "صدر دجاج (Hähnchenbrustfilet) مشوي 150غ + بطاطا مسلوقة بقشرها (Pellkartoffeln) 200غ + سلطة خيار (≈520 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "شريحتا خبز أسمر (Vollkornbrot) + جبنة هارتسر (Harzer Käse) 100غ + فجل وخيار (≈370 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثاني", "i_order": 2, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "بيضتان مسلوقتان + شريحة Vollkornbrot + طماطم (≈330 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s_name": "كمثرى (Birne) (≈90 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "الغداء", "i_order": 3, "list": [{"s_icon": "", "s_name": "شوربة عدس ألمانية (Linsensuppe) بصحن عميق + شريحة Vollkornbrot (≈520 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "سمك مدخّن (Räucherlachs) 80غ + خبز مقرمش (Knäckebrot) شريحتان + جبنة Frischkäse خفيفة (≈400 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم الثالث", "i_order": 3, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "سكير (Skyr) 200غ + ملعقة شوفان + نصف موزة (≈270 سعرة)", "i_calories": 0, "i_ eelachs مشوي 180غ + خضار مشوية + بطاطا 150غ (≈530 سعرة)", "i_calories": 0, "i_order": 1}]}, {"s_name": "العشاء", "i_order": 4, "list": [{"s_icon": "", "s_name": "سلطة كبيرة + Körniger Frischkäse 150غ + Knäckebrot شريحتان (≈400 سعرة)", "i_calories": 0, "i_order": 1}]}]}]}, {"s_name": "برنامج مكثّف — ثمانية أسابيع", "s_target": "أكبر نزول وزن آمن بلا إشراف طبي: 6–10 كجم خلال شهرين — نحو 1400 سعرة وبروتين عالٍ.", "i_days": 56, "s_description": "برنامج مكثّف لثمانية أسابيع، مصمَّم لأكبر نزول وزن يمكن تحقيقه **بأمان وبلا إشراف طبي**.\nنحو 1400 سعرة يوميًا، وبروتين عالٍ 120–140 غرامًا للحفاظ على العضل.\n\n*** كم تتوقّع فعلًا:\n6 إلى 10 كيلوغرامات خلال الشهرين لمن وزنه فوق 90 كجم، و4 إلى 7 لمن هو أخف.\nالأسبوع الأول ينزل أكثر (2–3 كجم) ومعظمه ماء لا دهن. لا تحبط حين يتباطأ بعده — هذا هو الطبيعي.\n\n*** لماذا لم أكتب لك رجيمًا أقسى:\nطلبتَ الأسرع، وسأكون صريحًا معك بدل مجاملتك:\nدراسة على برنامج تجاري قارنت حمية 500 سعرة بحمية 1200–1500 سعرة، فوجدت أن خطر حصى المرارة التي تستدعي دخول المستشفى **ارتفع نحو ثلاثة أضعاف ونصف**، وخطر استئصال المرارة نحو ثلاثة أضعاف. وبقي الخطر مرتفعًا حتى بعد حساب فارق الوزن المفقود.\nويُضاف إلى ذلك: فقدان الكتلة العضلية، واضطراب الأملاح، وتساقط الشعر، وتباطؤ الأيض الذي يُرجع الوزن أسرع مما نزل.\nالأنظمة تحت 800 سعرة موجودة فعلًا في الطب، وتُستعمل في بروتوكولات علاجية للسكري والسمنة المفرطة، لكنها تُعطى بإشراف طبيب ومع تحاليل دورية وبدائل وجبات مُدعّمة بالفيتامينات. إن كان هذا ما تريده، فاطلبه من طبيبك لا من تطبيق.\nما بين يديك هنا هو الحد الأقصى الذي أستطيع كتابته لك بضمير مرتاح — وهو أصلًا سريع.\n\n*** بنية الثمانية أسابيع:\nالأسابيع 1–3: التزام كامل بالقائمة.\nالأسبوع 4: **استراحة مقصودة** — أضف 150–200 سعرة يوميًا (حصة فاكهة إضافية + نصف شريحة خبز أسمر). ليست انتكاسة بل خطوة محسوبة: تُعيد ضبط هرمونات الشبع وتحمي الأيض وتمنع الانهيار النفسي.\nالأسابيع 5–7: عودة إلى القائمة كاملة.\nالأسبوع 8: استراحة ثانية كما في الرابع، ثم انتقل إلى حمية البحر المتوسط للمحافظة على ما أنجزت.\n\n*** ثلاث قواعد تحمي عضلك:\n1) البروتين في كل وجبة بلا استثناء — هو الفرق بين خسارة دهن وخسارة جسد.\n2) مشي 45 دقيقة يوميًا، أو 8000 خطوة.\n3) تمارين مقاومة مرتين أسبوعيًا ولو بوزن الجسم: قرفصاء، ضغط، سحب بشريط مطاطي.\nبلا هذه الثلاث ستنزل وزنًا، لكن ثلثه عضل، وسيعود أسرع.\n\n*** ماء وأملاح:\nلترين ونصف ماء يوميًا. مع الحمية المكثّفة يفقد الجسم صوديومًا وبوتاسيومًا، فلا تمتنع عن الملح تمامًا، وأكثِر من الخضار الورقية.\n\n*** المشتريات في ألمانيا:\nبروتين رخيص: Magerquark، Skyr، Harzer Käse، Körniger Frischkäse، Eier، Hähnchenbrustfilet، Putenbrust، Seelachsfilet، Kabeljau، Thunfisch، Linsen، Kichererbsen.\nخضار بحجم كبير وسعرات قليلة: Gurke، Tomaten، Salat، Radieschen، Kohlrabi، Blumenkohl، Brokkoli، Zucchini، Spinat، Sauerkraut، Möhren، Tiefkühl-Gemüse.\nحبوب: Haferflocken، Vollkornbrot، Knäckebrot، Bulgur (من المحل التركي).\nفواكه: Äpfel، Beeren، Orangen، Birnen.\n\n*** أوقفه فورًا وراجع طبيبك إن ظهر:\nألم شديد تحت الضلوع اليمنى أو بعد الأكل الدسم (قد يكون حصى مرارة).\nخفقان أو عدم انتظام في ضربات القلب، أو دوار عند الوقوف، أو إغماء.\nضعف عضلي شديد أو تشنّجات متكرّرة.\nاصفرار العين أو الجلد، أو بول داكن جدًا.\n\n*** لا تتبعه إطلاقًا إن كنت:\nحاملًا أو مرضعًا، أو دون الثامنة عشرة، أو فوق الخامسة والستين بلا إشراف.\nتتناول إنسولين أو دواء سكري أو مدرّات بول أو مميّعات — الجرعات تحتاج تعديلًا من طبيبك.\nلديك مرض كلى أو كبد أو قلب، أو تاريخ اضطراب أكل، أو مؤشر كتلة جسم أقل من 25.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. صِيغ استنادًا إلى أدلة منشورة، وهو قالب عام لا خطة شخصية. زِن نفسك مرة أسبوعيًا في اليوم نفسه، وتابع المتوسط الأسبوعي في قسم «تقدّمي» لا الرقم اليومي.\n", "i_order": 104, "days": [{"s_name": "اليوم 1 — الأسبوع 1", "i_order": 1, "meals": [{"s_name": "الإفطار", "i_order": 1, "list": [{"s_icon": "", "s_name": "كوارك خالي الدسم (Magerquark) 250غ + توت مجمّد نصف كوب + قرفة (≈230 سعرة · 30غ بروتين)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "قهوة أو شاي بلا سكر", "i_calories": 0, "i_order": 2}]}, {"s_name": "وجبة خفيفة", "i_order": 2, "list": [{"s_icon": "", "s   var added=0;
  EXTRA.forEach(function(p){
    var exists=PLANS.some(function(x){ return x.s_name===p.s_name; });
    if(!exists){ PLANS.push(p); added++; }
  });
  if(!added) return;

  /* إعادة بناء قائمة الاختيار مع الحفاظ على الرجيم المختار */
  var sel=document.getElementById("planSel");
