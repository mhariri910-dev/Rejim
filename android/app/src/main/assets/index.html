<script>
/* ===================================================================
   إضافات الواجهة — اختيار اليوم، إنجاز الوجبات، الماء، المشاركة، النصيحة
   لا تمسّ هذه الشيفرة بيانات الرجيمات ولا نصوصها إطلاقًا.
   =================================================================== */
(function(){
  "use strict";

  var LS_PLAN="dietapp_plan_v2", LS_OFFSET="dietapp_offset_v2", LS_START="dietapp_startdate_v2";
  var LS_DONE="diet_done_v1", LS_WATER="diet_water_v1";
  var CUPS=8;

  function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function dayKey(){ var d=today(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){ return {}; } }

  function planIdx(){
    var n=Number(localStorage.getItem(LS_PLAN)||0);
    return Math.max(0, Math.min(PLANS.length-1, isNaN(n)?0:n));
  }
  function planDays(){ return (PLANS[planIdx()]||{}).days || []; }

  /* نفس حساب اليوم المستعمل في التطبيق الأصلي */
  function baseDay(){
    var v=localStorage.getItem(LS_START);
    if(!v) return 1;
    var s=new Date(v);
    if(isNaN(s.getTime())) return 1;
    s.setHours(0,0,0,0);
    return Math.round((today()-s)/86400000)+1;
  }
  function totalDays(){ return planDays().length || 1; }
  function currentDay(){
    var o=Number(localStorage.getItem(LS_OFFSET)||0);
    return Math.max(1, Math.min(totalDays(), baseDay()+(isNaN(o)?0:o)));
  }
  function goToDay(n){
    n=Math.max(1, Math.min(totalDays(), n));
    localStorage.setItem(LS_OFFSET, String(n-baseDay()));
    render();
  }

  /* ---------- اختيار أي يوم مباشرة ---------- */

  function buildPicker(){
    if(document.getElementById("dayStrip")) return;
    var startBtn=document.getElementById("startBtn");
    if(!startBtn) return;
    var anchor=startBtn.closest(".row");
    if(!anchor) return;

    var box=document.createElement("div");
    box.className="dayPick";
    box.innerHTML=
      '<div class="dayPickHead">'+
        '<span class="dayPickLbl">اذهب إلى أي يوم</span>'+
        '<span class="dayPickTools">'+
          '<input id="dayJump" class="dayJump" type="number" min="1" inputmode="numeric" placeholder="رقم"/>'+
          '<button type="button" id="dayJumpGo" class="linkBtn">اذهب</button>'+
          '<button type="button" id="todayBtn" class="linkBtn">اليوم الحالي</button>'+
        '</span>'+
      '</div>'+
      '<div class="dayStrip" id="dayStrip"></div>';
    anchor.insertAdjacentElement("afterend", box);

    document.getElementById("todayBtn").onclick=function(){
      localStorage.setItem(LS_OFFSET,"0");
      render();
    };
    function jump(){
      var v=Number(document.getElementById("dayJump").value);
      if(v>=1) goToDay(v);
      document.getElementById("dayJump").value="";
      document.getElementById("dayJump").blur();
    }
    document.getElementById("dayJumpGo").onclick=jump;
    document.getElementById("dayJump").addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); jump(); }
    });
  }

  var firstPaint=true;
  function renderPicker(){
    buildPicker();
    var strip=document.getElementById("dayStrip");
    if(!strip) return;
    var total=totalDays(), cur=currentDay(), sig=planIdx()+"/"+total;

    if(strip.dataset.sig!==sig){
      strip.innerHTML="";
      for(var i=1;i<=total;i++){
        var b=document.createElement("button");
        b.type="button"; b.className="dayChip"; b.textContent=i; b.dataset.d=i;
        b.addEventListener("click", (function(n){ return function(){ goToDay(n); }; })(i));
        strip.appendChild(b);
      }
      strip.dataset.sig=sig;
      var jump=document.getElementById("dayJump");
      if(jump) jump.max=total;
    }

    var kids=strip.children, active=null;
    for(var j=0;j<kids.length;j++){
      var on=Number(kids[j].dataset.d)===cur;
      kids[j].classList.toggle("on", on);
      if(on) active=kids[j];
    }
    if(active){
      /* يُقاس الفرق بالبكسل فعليًا، فيعمل مع اتجاه الصفحة من اليمين لليسار */
      var smooth=!firstPaint;
      requestAnimationFrame(function(){
        try{
          var sr=strip.getBoundingClientRect(), ar=active.getBoundingClientRect();
          var delta=(ar.left+ar.width/2)-(sr.left+sr.width/2);
          if(Math.abs(delta)>1){
            strip.scrollBy({left:delta, behavior: smooth?"smooth":"auto"});
          }
        }catch(e){}
      });
    }
    firstPaint=false;
  }

  /* ---------- إنجاز الوجبات ---------- */

  function doneKey(){ return planIdx()+":"+currentDay(); }

  function markMeals(){
    var box=document.getElementById("mealBox");
    if(!box) return;
    var secs=box.querySelectorAll(".mealSection");
    var saved=readJSON(LS_DONE);
    var list=saved[doneKey()]||[];

    Array.prototype.forEach.call(secs, function(sec, i){
      var title=sec.querySelector(".mealTitle");
      if(!title) return;
      var on=list.indexOf(i)>-1;

      var btn=title.querySelector(".mealCheck");
      if(!btn){
        btn=document.createElement("button");
        btn.type="button";
        btn.className="mealCheck";
        btn.title="علّم كمنجَز";
        btn.setAttribute("aria-label","علّم كمنجَز");
        title.appendChild(btn);
        btn.addEventListener("click", function(){
          var d=readJSON(LS_DONE), k=doneKey(), arr=d[k]||[];
          var at=arr.indexOf(i);
          if(at>-1) arr.splice(at,1); else arr.push(i);
          d[k]=arr;
          localStorage.setItem(LS_DONE, JSON.stringify(d));
          var now=at===-1;
          sec.classList.toggle("done", now);
          btn.classList.toggle("on", now);
          updateDoneLine();
        });
      }
      sec.classList.toggle("done", on);
      btn.classList.toggle("on", on);
    });

    updateDoneLine();
  }

  function updateDoneLine(){
    var box=document.getElementById("mealBox");
    var host=document.getElementById("dayProgress");
    if(!box||!host) return;
    var total=box.querySelectorAll(".mealSection").length;
    var done=box.querySelectorAll(".mealSection.done").length;

    var el=document.getElementById("doneLine");
    if(!el){
      el=document.createElement("div");
      el.id="doneLine";
      el.className="doneLine";
      host.appendChild(el);
    }
    if(!total){ el.style.display="none"; return; }
    el.style.display="flex";
    el.innerHTML='<span>وجبات اليوم</span>'+
      '<span class="doneDots">'+
        Array.from({length:total},function(_,i){
          return '<i class="'+(i<done?"on":"")+'"></i>';
        }).join("")+
      '</span>'+
      '<span class="doneNum">'+done+' / '+total+'</span>';
  }

  /* ---------- شرب الماء ---------- */

  function buildWater(){
    if(document.getElementById("waterCard")) return;
    var cards=document.querySelectorAll("body > .card");
    if(!cards.length) return;
    var last=cards[cards.length-1];

    var c=document.createElement("div");
    c.className="card";
    c.id="waterCard";
    c.innerHTML=
      '<div class="row topRow" style="margin-bottom:12px">'+
        '<h2 style="margin:0">شرب الماء</h2>'+
        '<span class="badge" id="waterCount"></span>'+
      '</div>'+
      '<div class="cups" id="cups"></div>'+
      '<div class="small" id="waterLiters" style="margin-top:12px;font-weight:700"></div>'+
      '<div class="small" style="margin-top:6px">كل كوب = 250 مل (ربع لتر). اضغط الكوب بعد شربه. يبدأ العدّ من جديد كل يوم.</div>';
    last.insertAdjacentElement("afterend", c);

    var cups=c.querySelector("#cups");
    for(var i=0;i<CUPS;i++){
      var b=document.createElement("button");
      b.type="button"; b.className="cup"; b.dataset.i=i;
      b.setAttribute("aria-label","كوب "+(i+1));
      cups.appendChild(b);
      b.addEventListener("click",(function(n){ return function(){
        var w=readJSON(LS_WATER), k=dayKey(), cur=w[k]||0;
        w[k]=(cur===n+1)? n : n+1;      /* الضغط على آخر كوب ممتلئ يُفرغه */
        localStorage.setItem(LS_WATER, JSON.stringify(w));
        renderWater();
      };})(i));
    }
  }

  function renderWater(){
    buildWater();
    var cups=document.getElementById("cups");
    if(!cups) return;
    var n=readJSON(LS_WATER)[dayKey()]||0;
    var out=document.getElementById("waterCount");
    var L=function(c){ return String(Math.round(c*250)/1000); };
    if(out) out.textContent=n+" / "+CUPS+" أكواب";
    var lt=document.getElementById("waterLiters");
    if(lt) lt.textContent="شربت "+L(n)+" لتر من "+L(CUPS)+" لتر"+(n>=CUPS?" ✓ اكتمل هدف اليوم":"");
    Array.prototype.forEach.call(cups.children,function(b,i){
      b.classList.toggle("on", i<n);
    });
  }

  /* ---------- نسخ خطة اليوم ---------- */

  function dayText(){
    var out=[];
    var t=document.getElementById("planTitle");
    var d=document.getElementById("dayTitle");
    if(t) out.push(t.textContent.trim());
    if(d) out.push(d.textContent.trim());
    document.querySelectorAll("#mealBox .mealSection").forEach(function(s){
      out.push("");
      var h=s.querySelector(".mealTitle");
      out.push("— "+(h?h.textContent.trim():""));
      s.querySelectorAll("li").forEach(function(li){ out.push("• "+li.textContent.trim()); });
    });
    return out.join("\n");
  }

  function buildShare(){
    var info=document.getElementById("infoBtn");
    if(!info||document.getElementById("shareBtn")) return;
    var row=info.closest(".row");
    if(!row) return;
    var b=document.createElement("button");
    b.type="button"; b.id="shareBtn"; b.className="btnSoft";
    b.textContent="نسخ خطة اليوم";
    row.appendChild(b);
    b.addEventListener("click",function(){
      var txt=dayText();
      if(navigator.share){
        navigator.share({title:"خطة اليوم", text:txt}).catch(function(){});
        return;
      }
      var done=function(){
        b.textContent="تم النسخ ✓";
        setTimeout(function(){ b.textContent="نسخ خطة اليوم"; },1800);
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(function(){});
      }
    });
  }

  /* ---------- نصيحة اليوم ---------- */

  function buildTip(){
    var row=document.querySelector(".tipRow");
    if(!row||document.getElementById("tipShuffle")) return;
    var b=document.createElement("button");
    b.type="button"; b.id="tipShuffle"; b.className="linkBtn";
    b.textContent="نصيحة أخرى";
    row.appendChild(b);
    b.addEventListener("click",function(){
      if(typeof TIPS==="undefined"||!TIPS.length) return;
      var t=TIPS[Math.floor(Math.random()*TIPS.length)];
      var line=document.getElementById("tipLine");
      var more=document.getElementById("tipMore");
      var mb=document.getElementById("tipMoreBtn");
      if(line) line.textContent="نصيحة: "+t.t;
      if(more){ more.textContent=t.d; more.style.display="block"; }
      if(mb) mb.textContent="إخفاء";
    });
  }

  /* ---------- الربط مع دورة الرسم ---------- */

  function afterRender(){
    try{ renderPicker(); }catch(e){}
    try{ buildTip(); }catch(e){}
    try{ markMeals(); }catch(e){}
    try{ buildShare(); }catch(e){}
    try{ renderWater(); }catch(e){}
  }

  var original=window.render;
  if(typeof original==="function"){
    window.render=function(){
      var r=original.apply(this, arguments);
      afterRender();
      return r;
    };
  }

  /* أسهم لوحة المفاتيح للتنقل بين الأيام */
  document.addEventListener("keydown",function(e){
    if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if(document.querySelector(".modal.show, .modal.open")) return;
    if(e.key==="ArrowRight") goToDay(currentDay()-1);
    if(e.key==="ArrowLeft")  goToDay(currentDay()+1);
  });

  afterRender();
})();
</script>
<script>
/* ===================================================================
   بطاقة «الآن» — أول ما يظهر عند فتح التطبيق
   تعرض وجبات اليوم بأوقاتها، وتُبرز الوجبة الحالية وتتبدّل مع الوقت،
   مع بقاء بقية الوجبات ظاهرة. لا تمسّ نصوص الرجيم.
   =================================================================== */
(function(){
  "use strict";

  /* نفس أوقات الوجبات المستعملة داخل التطبيق */
  var MEAL_TIME={
    breakfast:{from:"06:00", to:"10:00", s:360,  e:600},
    snack:    {from:"10:00", to:"11:30", s:600,  e:690},
    lunch:    {from:"12:00", to:"15:00", s:720,  e:900},
    dinner:   {from:"18:00", to:"21:00", s:1080, e:1260}
  };
  var LABEL={breakfast:"الفطور", snack:"وجبة خفيفة", lunch:"الغداء", dinner:"العشاء",
              suhoor:"السحور", iftar:"فطور الصائم", afteriftar:"الوجبة الرئيسية", late:"وجبة خفيفة قبل النوم"};
  window.__MEAL_TIME=MEAL_TIME;

  /* توسيع التعرّف على اسم الوجبة: الأصل يعرف "الإفطار" فقط،
     بينما كثير من الأيام مكتوب فيها "الفطور" أو "بعد الغداء بساعة". */
  var origType=window.mealTypeFromTitle;
  window.mealTypeFromTitle=function(title){
    var t=(title||"").toString().trim();
    if(!t) return "generic";
    if(/^بعد\s|سناك|تصبيرة|وجبة خفيفة|خفيفة/.test(t)) return "snack";
    var base=origType? origType(t) : "generic";
    if(base!=="generic") return base;
    if(/فطور|افطار|إفطار|صباح/.test(t)) return "breakfast";
    if(/غداء|ظهر/.test(t))             return "lunch";
    if(/عشاء|مساء/.test(t))            return "dinner";
    return "generic";
  };

  function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
  function hhmm(){
    var d=new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function dur(m){
    m=Math.max(0, Math.round(m));
    var h=Math.floor(m/60), r=m%60;
    if(h&&r) return h+" س "+r+" د";
    if(h)    return h+" س";
    return r+" د";
  }

  function typeOf(sec){
    var cls=sec.className||"";
    var m=cls.match(/meal-([a-z]+)/);
    return m? m[1] : "generic";
  }

  function build(){
    if(document.getElementById("nowCard")) return;
    var c=document.createElement("div");
    c.className="card nowCard";
    c.id="nowCard";
    c.innerHTML=
      '<div class="nowTop">'+
        '<div>'+
          '<div class="nowLbl">الآن</div>'+
          '<div class="nowClock" id="nowClock">--:--</div>'+
        '</div>'+
        '<div class="nowDay" id="nowDay"></div>'+
      '</div>'+
      '<div class="nowHead" id="nowHead"></div>'+
      '<div class="nowList" id="nowList"></div>';
    document.body.insertBefore(c, document.body.firstElementChild);
  }

  function render(){
    build();
    var box=document.getElementById("mealBox");
    var list=document.getElementById("nowList");
    var head=document.getElementById("nowHead");
    var card=document.getElementById("nowCard");
    if(!box||!list||!head) return;

    document.getElementById("nowClock").textContent=hhmm();

    var dayTxt=document.getElementById("dayProgText");
    var planT =document.getElementById("planTitle");
    document.getElementById("nowDay").innerHTML=
      '<div class="nowPlan">'+(planT?planT.textContent.trim():"")+'</div>'+
      '<div class="nowDayNo">'+(dayTxt?dayTxt.textContent.trim():"")+'</div>';

    var secs=Array.prototype.slice.call(box.querySelectorAll(".mealSection"));
    if(!secs.length){
      card.style.display="none";
      return;
    }
    card.style.display="";

    var rows=secs.map(function(sec,i){
      var t=typeOf(sec);
      return {el:sec, idx:i, type:t, time:MEAL_TIME[t]||null,
              title:(sec.querySelector(".mealTitle")||{textContent:""}).textContent.trim(),
              done:sec.classList.contains("done")};
    });

    var timed=rows.filter(function(r){return r.time;}).sort(function(a,b){return a.time.s-b.time.s;});
    var plain=rows.filter(function(r){return !r.time;});

    var n=nowMin();
    var current=null, next=null;
    timed.forEach(function(r){
      if(n>=r.time.s && n<r.time.e) current=current||r;
    });
    timed.forEach(function(r){
      if(!next && n<r.time.s) next=r;
    });

    /* السطر الرئيسي */
    var rSuh=rows.filter(function(r){return r.type==="suhoor"&&r.time;})[0];
    var rIft=rows.filter(function(r){return r.type==="iftar"&&r.time;})[0];
    if(rSuh && rIft && n>=rSuh.time.e && n<rIft.time.s){
      var fp=Math.round(((n-rSuh.time.e)/(rIft.time.s-rSuh.time.e))*100);
      head.className="nowHead live";
      head.innerHTML=
        '<span class="nowBig">أنت صائم 🌙</span>'+
        '<span class="nowSub">الإفطار بعد '+dur(rIft.time.s-n)+' · '+rIft.time.from+'</span>'+
        '<span class="nowBar"><i style="width:'+fp+'%"></i></span>';
    } else if(!timed.length){
      head.className="nowHead plain";
      head.innerHTML='<span class="nowBig">وجبات اليوم</span>'+
                     '<span class="nowSub">هذا الرجيم بلا أوقات محدّدة</span>';
    } else if(current){
      var left=current.time.e-n;
      var pct=Math.round(((n-current.time.s)/(current.time.e-current.time.s))*100);
      head.className="nowHead live";
      head.innerHTML=
        '<span class="nowBig">'+(LABEL[current.type]||current.title)+'</span>'+
        '<span class="nowSub">وقتها الآن · يتبقّى '+dur(left)+'</span>'+
        '<span class="nowBar"><i style="width:'+pct+'%"></i></span>';
    } else if(next){
      head.className="nowHead soon";
      head.innerHTML=
        '<span class="nowBig">'+(LABEL[next.type]||next.title)+'</span>'+
        '<span class="nowSub">يبدأ بعد '+dur(next.time.s-n)+' · '+next.time.from+'</span>';
    } else {
      head.className="nowHead rest";
      var first=timed[0];
      head.innerHTML='<span class="nowBig">انتهت وجبات اليوم</span>'+
                     '<span class="nowSub">'+(first? (LABEL[first.type]||first.title)+' غدًا '+first.time.from : '')+'</span>';
    }

    /* قائمة كل الوجبات — تبقى ظاهرة دائمًا */
    list.innerHTML="";
    timed.concat(plain).forEach(function(r){
      var state="later", note="", badge="";
      if(!r.time){
        state="plain"; note="طوال اليوم"; badge="";
      } else if(current===r){
        state="live"; note="يتبقّى "+dur(r.time.e-n); badge="الآن";
      } else if(n>=r.time.e){
        state="past"; note="انتهى وقتها"; badge="";
      } else if(next===r){
        state="next"; note="بعد "+dur(r.time.s-n); badge="التالية";
      } else {
        note="بعد "+dur(r.time.s-n);
      }
      if(r.done){ state="done"; badge="✓ تمّت"; }

      var row=document.createElement("button");
      row.type="button";
      row.className="nowRow "+state;
      row.innerHTML=
        '<span class="nowDot"></span>'+
        '<span class="nowName">'+(LABEL[r.type]||r.title)+
          (badge?'<span class="nowTag">'+badge+'</span>':'')+'</span>'+
        '<span class="nowWhen">'+(r.time? r.time.from+' — '+r.time.to : '')+'</span>'+
        '<span class="nowNote">'+note+'</span>';
      row.addEventListener("click",function(){
        r.el.scrollIntoView({behavior:"smooth", block:"center"});
        r.el.classList.add("flash");
        setTimeout(function(){ r.el.classList.remove("flash"); },1200);
      });
      list.appendChild(row);
    });
  }

  /* يُعاد الرسم بعد كل تحديث للصفحة، وكل نصف دقيقة لتتبدّل الحالة مع الوقت */
  var prev=window.render;
  if(typeof prev==="function"){
    window.render=function(){
      var r=prev.apply(this,arguments);
      try{ render(); }catch(e){}
      return r;
    };
  }
  setInterval(function(){ try{ render(); }catch(e){} }, 30000);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){ try{ render(); }catch(e){} }
  });

  /* إعادة رسم أولى كي تأخذ الوجبات أنواعها وأوقاتها الصحيحة */
  if(typeof window.render==="function"){ try{ window.render(); }catch(e){} }
  try{ render(); }catch(e){}
})();
</script>
<script>
/* ===================================================================
   أنظمة رمضان (أربعة أنظمة) + مواقيت الإمساك والمغرب في ديلمنهورست.
   تُلحَق بالقائمة ولا تعدّل أي نظام أصلي.
   =================================================================== */
(function(){
  "use strict";

  var RAM=[{"s_name": "رجيم رمضان — متوازن (≈1500 سعرة)", "s_target": "إنقاص نحو نصف كيلو أسبوعيًا خلال رمضان مع الحفاظ على الطاقة، بأطعمة تُشترى من السوبرماركت الألماني والمحال العربية.", "i_days": 30, "s_description": "نظام متوازن لشهر رمضان كاملًا (30 يومًا) بنحو 1500 سعرة يوميًا موزّعة على أربع محطات: السحور، فطور الصائم، الوجبة الرئيسية بعد الفطور، ووجبة خفيفة قبل النوم.\n\n*** الأوقات:\nالسحور قبل الفجر بساعة ونصف حتى الإمساك · فطور الصائم عند أذان المغرب · الوجبة الرئيسية بعد الفطور بساعة ونصف · الوجبة الخفيفة قبل النوم.\n\n*** مواقيت الصيام في ديلمنهورست:\nيعرض التطبيق تلقائيًا في كل يوم وقت الإمساك (الفجر) والشروق والمغرب، محسوبة لمدينة ديلمنهورست من موضع الشمس. الفجر عند زاوية 18 درجة والمغرب عند الغروب. قد يختلف مسجدك بدقائق قليلة، فاعتمد تقويم مسجدك إن اختلف، وأمسك قبل الفجر بعشر دقائق احتياطًا.\nفي ألمانيا يطول الصيام نحو 11 ساعة ونصف في بداية الشهر ويصل نحو 13 ساعة في آخره، وهو أقصر من الصيف بكثير.\n\n*** متى يبدأ رمضان؟\nيبدأ رمضان 1448 تقريبًا يوم 8 فبراير 2027 وينتهي نحو 9 مارس 2027، ويتغيّر يومًا بحسب رؤية الهلال. اختر «تاريخ البداية» أول يوم صيام فعلي ثم اضغط «ابدأ من اليوم».\n\n*** قواعد عامة تنفع في كل الأنظمة:\nافطر على 3 تمرات وكوب ماء، ثم شوربة، وانتظر قليلًا قبل الوجبة الرئيسية حتى لا تأكل بسرعة.\nاشرب بين الفطور والسحور ما بين 2 و2.5 لتر ماء موزّعة على أكواب. سجّلها في بطاقة «شرب الماء».\nتجنّب المقليات والحلويات الشرقية الثقيلة وعصائر السكر. الحلوى مرة أو مرتين في الأسبوع بقطعة صغيرة.\nامشِ 20 إلى 30 دقيقة بعد الفطور بساعة تقريبًا أو بعد التراويح.\nنم ساعات كافية، فقلة النوم ترفع الجوع.\nالسعرات المكتوبة تقريبية. إن كنت طويلًا أو نشيطًا جدًا فزِد حصة النشويات في الوجبة الرئيسية قليلًا، وإن كنت قصيرًا فأنقصها.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. هو قالب عام لا خطة شخصية.\nاستشر طبيبك قبل الصيام والبدء بأي نظام، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد أو القلب، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف  الرئيسية حتى لا تأكل بسرعة.\nاشرب بين الفطور والسحور ما بين 2 و2.5 لتر ماء موزّعة على أكواب. سجّلها في بطاقة «شرب الماء».\nتجنّب المقليات والحلويات الشرقية الثقيلة وعصائر السكر. الحلوى مرة أو مرتين في الأسبوع بقطعة صغيرة.\nامشِ 20 إلى 30 دقيقة بعد الفطور بساعة تقريبًا أو بعد التراويح.\nنم ساعات كافية، فقلة النوم ترفع الجوع.\nالسعرات المكتوبة تقريبية. إن كنت طويلًا أو نشيطًا جدًا فزِد حصة النشويات في الوجبة الرئيسية قليلًا، وإن كنت قصيرًا فأنقصها.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. هو قالب عام لا خطة شخصية.\nاستشر طبيبك قبل الصيام والبدء بأي نظام، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد أو القلب، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان أو إغماء فأفطر وراجع طبيبك.\n", "i_order": 102, "days": [{"s_name": "اليوم 1 من رمضان", "i_order": 1, "meals": [{"s_name": "السحور", "i_order": 1, "list": [{"s_icon": "", "s_name": "3 بيضات (عجة أو مسلوقة) + خيار وطماطم + شريحة خبز Vollkornbrot (≈400 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "اشرب كوبين من الماء قبل الإمساك. قهوة أو شاي بلا سكر إن أردت.", "i_calories": 0, "i_order": 2}]}, {"s_name": "فطور الصائم", "i_order": 2, "list": [{"s_icon": "", "s_name": "2 تمرتان + كوب ماء", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "شوربة دجاج بالخضار (طبق متوسط)", "i_calories": 0, "i_order": 2}, {"s_icon": "", "s_name": "بعد الفطور بنحو ساعة تأتي الوجبة الرئيسية (القسم التالي). صلّ المغرب ثم انتظر قليلًا.", "i_calories": 0, "i_order": 3}]}, {"s_name": "الوجبة الرئيسية (بعد الفطور)", "i_order": 3, "list": [{"s_icon": "", "s_name": "ورك دجاج منزوع الجلد 2 قطعة بالفرن + سلطة ملفوف + 60غ أرز (≈560 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "ماء أو شاي أعشاب بلا سكر. لا مشروبات محلّاة.", "i_calories": 0, "i_order": 2}]}, {"s_name": "وجبة خفيفة قبل النوم", "i_order": 4, "list": [{"s_icon": "", "s_name": "زبادي يوناني 150غ (≈140 سعرة)  تغذية. هو قالب عام لا خطة شخصية.\nاستشر طبيبك قبل الصيام والبدء بأي نظام، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد أو القلب، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان أو إغماء فأفطر وراجع طبيبك.\n", "i_order": 103, "days": [{"s_name": "اليوم 1 من رمضان", "i_order": 1, "meals": [{"s_name": "السحور", "i_order": 1, "list": [{"s_icon": "", "s_name": "حمص 4 ملاعق + شريحتان خبز Vollkornbrot + خيار وطماطم + زيتون (≈420 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "اشرب كوبين من الماء قبل الإمساك. قهوة أو شاي بلا سكر إن أردت.", "i_calories": 0, "i_order": 2}]}, {"s_name": "فطور الصائم", "i_order": 2, "list": [{"s_icon": "", "s_name": "3 تمرات + كوب ماء", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "شوربة عدس بالليمون (طبق متوسط) + شريحة خبز", "i_calories": 0, "i_order": 2}, {"s_icon": "", "s_name": "بعد الفطور بنحو ساعة تأتي الوجبة الرئيسية (القسم التالي). صلّ المغرب ثم انتظر قليلًا.", "i_calories": 0, "i_order": 3}]}, {"s_name": "الوجبة الرئيسية (بعد الفطور)", "i_order": 3, "list": [{"s_icon": "", "s_name": "شيش طاووق دجاج مشوي 150غ + سلطة + 4 ملاعق حمص (≈580 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "ماء أو شاي أعشاب بلا سكر. لا مشروبات محلّاة.", "i_calories": 0, "i_order": 2}]}, {"s_name": "وجبة خفيفة قبل النوم", "i_order": 4, "list": [{"s_icon": "", "s_name": "كوب حليب دافئ 200مل (≈100 سعرة)", "i_calories": 0, "i_order": 1}]}]}, {"s_name": "اليوم 2 من رمضان", "i_order": 2, "meals": [{"s_name": "السحور", "i_order": 1, "list": [{"s_icon": "", "s_name": "زبادي 200غ + شوفان 40غ + ملعقة صغيرة عسل + 6 لوزات (≈380 سعرة)", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "اشرب كوبين من الماء قبل الإمساك. قهوة أو شاي بلا سكر إن أردت.", "i_calories": 0, "i_order": 2}]}, {"s_name": "فطور الصائم", "i_order": 2, "list": [{"s_icon": "", "s_name": "3 تمرات + كوب ماء", "i_calories": 0, "i_order": 1}, {"s_icon": "", "s_name": "شوربة شع ى البقوليات والبيض والألبان.", "i_days": 30, "s_description": "نظام نباتي (بيض وألبان بلا لحوم) لشهر رمضان كاملًا (30 يومًا) بنحو 1450 سعرة. يعتمد على العدس والحمص والفول والفاصولياء والتوفو والكينوا. انتبه لفيتامين B12 والحديد، فاستشر طبيبك إن اتبعته لأكثر من الشهر.\n\n*** الأوقات:\nالسحور قبل الفجر بساعة ونصف حتى الإمساك · فطور الصائم عند أذان المغرب · الوجبة الرئيسية بعد الفطور بساعة ونصف · الوجبة الخفيفة قبل النوم.\n\n*** مواقيت الصيام في ديلمنهورست:\nيعرض التطبيق تلقائيًا في كل يوم وقت الإمساك (الفجر) والشروق والمغرب، محسوبة لمدينة ديلمنهورست من موضع الشمس. الفجر عند زاوية 18 درجة والمغرب عند الغروب. قد يختلف مسجدك بدقائق قليلة، فاعتمد تقويم مسجدك إن اختلف، وأمسك قبل الفجر بعشر دقائق احتياطًا.\nفي ألمانيا يطول الصيام نحو 11 ساعة ونصف في بداية الشهر ويصل نحو 13 ساعة في آخره، وهو أقصر من الصيف بكثير.\n\n*** متى يبدأ رمضان؟\nيبدأ رمضان 1448 تقريبًا يوم 8 فبراير 2027 وينتهي نحو 9 مارس 2027، ويتغيّر يومًا بحسب رؤية الهلال. اختر «تاريخ البداية» أول يوم صيام فعلي ثم اضغط «ابدأ من اليوم».\n\n*** قواعد عامة تنفع في كل الأنظمة:\nافطر على 3 تمرات وكوب ماء، ثم شوربة، وانتظر قليلًا قبل الوجبة الرئيسية حتى لا تأكل بسرعة.\nاشرب بين الفطور والسحور ما بين 2 و2.5 لتر ماء موزّعة على أكواب. سجّلها في بطاقة «شرب الماء».\nتجنّب المقليات والحلويات الشرقية الثقيلة وعصائر السكر. الحلوى مرة أو مرتين في الأسبوع بقطعة صغيرة.\nامشِ 20 إلى 30 دقيقة بعد الفطور بساعة تقريبًا أو بعد التراويح.\nنم ساعات كافية، فقلة النوم ترفع الجوع.\nالسعرات المكتوبة تقريبية. إن كنت طويلًا أو نشيطًا جدًا فزِد حصة النشويات في الوجبة الرئيسية قليلًا، وإن كنت قصيرًا فأنقصها.\n\n*** قبل أن تبدأ:\nهذا النظام أُضيف إلى التطبيق بمساعدة الذكاء الاصطناعي، ولم يكتبه اختصاصي تغذية. هو قالب عام لا خطة شخصية.\nاستشر طبيبك قبل الصيام والبدء بأي نظام، خصوصًا إن كنت تتناول دواءً للسكري أو الضغط أو مميّعات الدم، أو لديك مرض في الكلى أو الكبد أو القلب، أو كنت حاملًا أو مرضعًا، أو دون الثامنة عشرة.\nإن شعرت بدوار أو ضعف شديد أو خفقان أو إغماء فأفطر وراجع طبيبك.\n", "i_order": 104, "days": [{"s_name": "اليوم 1 من رمضان", "i_order"     return [noon-H,noon+H];
  }
  return {noon:noon, fajr:at(18), sun:at(0.833)};
}
function berlinOffsetMin(y,m,d){ // CET/CEST offset in minutes for that date at noon
  var dt=new Date(Date.UTC(y,m-1,d,12,0,0));
  var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt);
  var hh=+p.find(function(x){return x.type==='hour'}).value, mm=+p.find(function(x){return x.type==='minute'}).value;
  return (hh*60+mm)-720;
}
function delmenhorstTimes(y,m,d){
  var s=solarTimes(y,m,d,53.0517,8.6308), off=berlinOffsetMin(y,m,d);
  var fajr=s.fajr? Math.round(s.fajr[0]+off) : null;
  var rise=Math.round(s.sun[0]+off);
  var maghrib=Math.round(s.sun[1]+off+1);   // +1 min safety, as in common Islamic calendars
  return {fajr:fajr, sunrise:rise, maghrib:maghrib};
}


  function isRamadanPlan(){
    var i=Number(localStorage.getItem("dietapp_plan_v2")||0);
    var p=PLANS[i];
    return !!(p&&/^رجيم رمضان/.test(p.s_name||""));
  }
  function shownDate(){
    var now=new Date(); now.setHours(0,0,0,0);
    var v=localStorage.getItem("dietapp_startdate_v2");
    if(!v) return now;
    var st=new Date(v); if(isNaN(st.getTime())) return now;
    st.setHours(0,0,0,0);
    var off=Number(localStorage.getItem("dietapp_offset_v2")||0);
    var n=Math.round((now-st)/86400000)+1+off;
    var i=Number(localStorage.getItem("dietapp_plan_v2")||0);
    var total=(PLANS[i]&&PLANS[i].days||[]).length||1;
    n=Math.max(1,Math.min(total,n));
    var d=new Date(st); d.setDate(d.getDate()+n-1);
    return d;
  }
  function hm(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  function win(s,e){ return {from:hm(s), to:hm(e>=1440?1439:e), s:s, e:Math.min(e,1439)}; }

  function updateTimes(){
    var T=window.__MEAL_TIME; if(!T) return null;
    ["suhoor","iftar","afteriftar","late"].forEach(function(k){ delete T[k]; });
    if(!isRamadanPlan()) return null;
    var d=shownDate();
    var t=delmenhorstTimes(d.getFullYear(),d.getMonth()+1,d.getDate());
    if(t.fajr===null) return null;
    T.suhoor=win(t.fajr-90,t.fajr);
    T.iftar=win(t.maghrib,t.maghrib+45);
    T.afteriftar=win(t.maghrib+90,t.maghrib+210);
    T.late=win(t.maghrib+210,t.maghrib+300);
    return t;
  }

  function decorate(t){
    var old=document.getElementById("ramTimes"); if(old) old.remove();
    if(!t) return;
    var T=window.__MEAL_TIME;
    var title=document.getElementById("dayTitle");
    if(title){
      var fast=t.maghrib-t.fajr, fh=Math.floor(fast/60), fm=fast%60;
      var el=document.createElement("div");
      el.id="ramTimes"; el.className="small";
      el.style.cssText="margin:6px 0 10px;line-height:1.8";
      el.innerHTML="🌙 <b>ديلمنهورست</b> · الإمساك (الفجر) <b>"+hm(t.fajr)+"</b> · الشروق "+hm(t.sunrise)+" · المغرب (الإفطار) <b>"+hm(t.maghrib)+"</b> · مدة الصيام "+fh+" س "+fm+" د";
      title.insertAdjacentElement("afterend",el);
    }
    var names={suhoor:"من %f حتى الإمساك %t",iftar:"عند أذان المغرب %f",afteriftar:"من %f إلى %t",late:"من %f إلى %t"};
    Array.prototype.forEach.call(document.querySelectorAll("#mealBox .mealSection"),function(sec){
      var m=(sec.className.match(/meal-([a-z]+)/)||[])[1];
      if(!m||!names[m]||!T[m]||sec.querySelector(".ramWhen")) return;
      var div=document.createElement("div");
      div.className="small ramWhen"; div.style.marginTop="4px";
      div.textContent="الوقت: "+names[m].replace("%f",T[m].from).replace("%t",T[m].to);
      var title2=sec.querySelector(".mealTitle");
      if(title2) title2.insertAdjacentElement("afterend",div); else sec.appendChild(div);
    });
  }

  /* تمييز عناوين وجبات رمضان */
  var prevType=window.mealTypeFromTitle;
  window.mealTypeFromTitle=function(title){
    var t=(title||"").toString().trim();
    if(t==="السحور") return "suhoor";
    if(t==="فطور الصائم") return "iftar";
    if(t==="الوجبة الرئيسية (بعد الفطور)") return "afteriftar";
    if(t==="وجبة خفيفة قبل النوم") return "late";
    return prevType? prevType(title) : "generic";
  };

  var prev=window.render;
  window.render=function(){
    var t=updateTimes();
    var r=prev? prev.apply(this,arguments) : undefined;
    try{ decorate(t); }catch(e){}
    return r;
  };
  try{ window.render(); }catch(e){}
})();
</script>
<script>
/* ===================================================================
   طبقة التقدّم: سلسلة الالتزام، التقويم الشهري، المتوسط الأسبوعي للوزن،
   محيط الخصر، وزن الهدف، والملاحظة اليومية.
   لا تمسّ هذه الشيفرة محتوى الرجيمات ولا نصوصها.
   =================================================================== */
(function(){
  "use strict";

  var K_LOG="diet_log_v1";      /* {"2026-10-10":{d:2,t:3}} */
  var K_WAIST="diet_waist_v1";  /* {"2026-10-10": 92}       */
  var K_GOAL="diet_goal_v1";
  var K_NOTE="diet_note_v1";    /* {"2026-10-10":"..."}     */
  var WKEY="dp_weights_v1";

  function J(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){ return {}; } }
  function A(k){ try{ var v=JSON.parse(localStorage.getItem(k)||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
  function S(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function iso(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayISO(){ var d=new Date(); d.setHours(0,0,0,0); return iso(d); }
  function shift(isoStr,n){
    var p=isoStr.split("-");
    var d=new Date(+p[0], +p[1]-1, +p[2]);
    d.setDate(d.getDate()+n);
    return iso(d);
  }
  function num(v){ v=parseFloat(String(v).replace(",",".")); return isFinite(v)? v : null; }

  /* ---------- سجل الالتزام اليومي ---------- */

  function writeLog(){
    var box=document.getElementById("mealBox");
    if(!box) return;
    var t=box.querySelectorAll(".mealSection").length;
    if(!t) return;
    /* يُسجَّل يوم المستخدم الحالي فقط — لا الأيام التي يتصفّحها للاطّلاع */
    var off=Number(localStorage.getItem("dietapp_offset_v2")||0);
    if(off!==0) return;
    var log=J(K_LOG), k=todayISO();
    var d=box.querySelectorAll(".mealSection.done").length;
    if(d===0 && !log[k]) return;
    log[k]={d:d,t:t};
    S(K_LOG, log);
  }

  function streak(){
    var log=J(K_LOG), n=0, k=todayISO();
    if(!(log[k] && log[k].t && log[k].d>=log[k].t)) k=shift(k,-1);  /* اليوم الجاري لا يكسر السلسلة */
    while(log[k] && log[k].t && log[k].d>=log[k].t){ n++; k=shift(k,-1); }
    return n;
  }
  function bestStreak(){
    var log=J(K_LOG);
    var keys=Object.keys(log).filter(function(k){return log[k].t && log[k].d>=log[k].t;}).sort();
    var best=0, run=0, prev=null;
    keys.forEach(function(k){
      run = (prev && shift(prev,1)===k) ? run+1 : 1;
      if(run>best) best=run;
      prev=k;
    });
    return best;
  }

  /* ---------- الوزن ---------- */

  function weights(){
    return A(WKEY).map(function(e){ return {date:e.date, w:num(e.w)}; })
      .filter(function(e){ return e.date && e.w!==null; })
      .sort(function(a,b){ return a.date<b.date? -1 : 1; });
  }
  function avgRange(list, fromISO, toISO){
    var v=list.filter(function(e){ return e.date>=fromISO && e.date<=toISO; });
    if(!v.length) return null;
    return v.reduce(function(s,e){ return s+e.w; },0)/v.length;
  }
  function weeklySeries(list){
    /* متوسط كل 7 أيام رجوعًا من اليوم — يُظهر الاتجاه بدل تذبذب الماء */
    var out=[], end=todayISO();
    for(var i=0;i<8;i++){
      var from=shift(end,-6);
      var a=avgRange(list, from, end);
      out.unshift({from:from, to:end, avg:a});
      end=shift(from,-1);
    }
    return out;
  }

  /* ---------- البناء ---------- */

  function build(){
    if(document.getElementById("progCard")) return;
    var host=document.getElementById("waterCard");
    if(!host){
      var cs=document.querySelectorAll("body > .card");
      host=cs[cs.length-1];
    }
    if(!host) return;

    var c=document.createElement("div");
    c.className="card progCard";
    c.id="progCard";
    c.innerHTML=
      '<div class="secHead"><h2>تقدّمي</h2></div>'+

      '<div class="statGrid">'+
        '<div class="stat"><div class="statV" id="stStreak">0</div><div class="statL">يوم متتالٍ</div></div>'+
        '<div class="stat"><div class="statV" id="stBest">0</div><div class="statL">أطول سلسلة</div></div>'+
        '<div class="stat"><div class="statV" id="stDays">0</div><div class="statL">أيام مكتملة</div></div>'+
      '</div>'+

      '<div class="small statHelp" style="margin:6px 0 14px;line-height:1.7">'+
        '<b>اليوم المكتمل</b> هو اليوم الذي تضع فيه ✓ على كل وجباته.<br>'+
        '<b>يوم متتالٍ</b>: عدد الأيام المكتملة المتتالية حتى اليوم. يتوقف العدّ إذا مرّ يوم بلا اكتمال.<br>'+
        '<b>أطول سلسلة</b>: أطول عدد أيام مكتملة متتالية حققته.<br>'+
        '<b>أيام مكتملة</b>: مجموع كل الأيام المكتملة.<br>'+
        'يُسجَّل اليوم الحالي فقط، لا الأيام التي تتصفحها.'+
      '</div>'+
      '<div class="goalBox" id="goalBox">'+
        '<div class="goalTop">'+
          '<span class="goalLbl">وزن الهدف</span>'+
          '<span class="goalEdit"><input id="goalIn" type="number" step="0.1" inputmode="decimal" placeholder="كجم"/>'+
          '<button type="button" id="goalSave" class="linkBtn">حفظ</button></span>'+
        '</div>'+
        '<div class="goalBar"><i id="goalFill"></i></div>'+
        '<div class="goalTxt small" id="goalTxt">أدخل وزن الهدف لمتابعة تقدّمك</div>'+
      '</div>'+

      '<div class="trendBox">'+
        '<div class="trendTop">'+
          '<span class="trendLbl">المتوسط الأسبوعي للوزن</span>'+
          '<span class="trendDelta" id="trendDelta"></span>'+
        '</div>'+
        '<div class="trendChart" id="trendChart"></div>'+
        '<div class="small" id="trendNote">الوزن يتذبذب يوميًا بسبب الماء والملح. المتوسط الأسبوعي يُظهر الاتجاه الحقيقي.</div>'+
      '</div>'+

      '<div class="waistBox">'+
        '<span class="waistLbl">محيط الخصر اليوم</span>'+
        '<span class="waistIn">'+
          '<input id="waistIn" type="number" step="0.5" inputmode="decimal" placeholder="سم"/>'+
          '<button type="button" id="waistSave" class="linkBtn">حفظ</button>'+
        '</span>'+
        '<span class="waistOut small" id="waistOut"></span>'+
      '</div>'+

      '<div class="noteBox">'+
        '<label class="noteLbl" for="noteIn">ملاحظة اليوم</label>'+
        '<textarea id="noteIn" rows="2" placeholder="كيف كان يومك؟ ما الذي كان صعبًا؟"></textarea>'+
      '</div>'+

      '<div class="calBox">'+
        '<div class="calHead">'+
          '<button type="button" id="calPrev" class="iconBtn calNav">‹</button>'+
          '<span class="calTitle" id="calTitle"></span>'+
          '<button type="button" id="calNext" class="iconBtn calNav">›</button>'+
        '</div>'+
        '<div class="calDow"><span>أحد</span><span>اثنين</span><span>ثلاثاء</span><span>أربعاء</span><span>خميس</span><span>جمعة</span><span>سبت</span></div>'+
        '<div class="calGrid" id="calGrid"></div>'+
        '<div class="calKey small"><i class="full"></i> مكتمل <i class="part"></i> جزئي <i class="none"></i> بلا تسجيل</div>'+
      '</div>';

    host.insertAdjacentElement("afterend", c);
    wire();
  }

  var calRef=null;   /* الشهر المعروض */

  function wire(){
    document.getElementById("goalSave").addEventListener("click", function(){
      var v=num(document.getElementById("goalIn").value);
      if(v===null) return;
      localStorage.setItem(K_GOAL, String(v));
      renderAll();
    });
    document.getElementById("waistSave").addEventListener("click", function(){
      var v=num(document.getElementById("waistIn").value);
      if(v===null) return;
      var w=J(K_WAIST); w[todayISO()]=v; S(K_WAIST,w);
      document.getElementById("waistIn").value="";
      renderAll();
    });
    var note=document.getElementById("noteIn");
    note.addEventListener("input", function(){
      var n=J(K_NOTE); n[todayISO()]=note.value; S(K_NOTE,n);
    });
    document.getElementById("calPrev").addEventListener("click", function(){
      calRef.setMonth(calRef.getMonth()-1); renderCal();
    });
    document.getElementById("calNext").addEventListener("click", function(){
      calRef.setMonth(calRef.getMonth()+1); renderCal();
    });
  }

  /* ---------- الرسم ---------- */

  function renderStats(){
    var log=J(K_LOG);
    var full=Object.keys(log).filter(function(k){ return log[k].t && log[k].d>=log[k].t; }).length;
    document.getElementById("stStreak").textContent=streak();
    document.getElementById("stBest").textContent=bestStreak();
    document.getElementById("stDays").textContent=full;
  }

  function renderGoal(){
    var g=num(localStorage.getItem(K_GOAL));
    var list=weights();
    var box=document.getElementById("goalBox");
    var fill=document.getElementById("goalFill");
    var txt=document.getElementById("goalTxt");
    var inp=document.getElementById("goalIn");
    if(g!==null && document.activeElement!==inp) inp.value=g;

    if(g===null || list.length===0){
      fill.style.width="0%";
      txt.textContent = g===null ? "أدخل وزن الهدف لمتابعة تقدّمك"
                                 : "سجّل وزنك في قسم «الوزن» ليظهر تقدّمك";
      box.classList.remove("reached");
      return;
    }
    var first=list[0].w, last=list[list.length-1].w;
    var span=Math.abs(first-g);
    var moved=Math.abs(first-last);
    var pct= span>0 ? Math.max(0, Math.min(100, Math.round(moved/span*100))) : 100;
    var remain=Math.abs(last-g);
    fill.style.width=pct+"%";
    box.classList.toggle("reached", remain<0.3);
    txt.textContent = remain<0.3
      ? "وصلت إلى هدفك. أحسنت."
      : "قطعت "+moved.toFixed(1)+" كجم من "+span.toFixed(1)+" · يتبقّى "+remain.toFixed(1)+" كجم";
  }

  function renderTrend(){
    var list=weights();
    var host=document.getElementById("trendChart");
    var delta=document.getElementById("trendDelta");
    var series=weeklySeries(list).filter(function(p){ return p.avg!==null; });

    if(series.length<1){
      host.innerHTML='<div class="trendEmpty small">سجّل وزنك مرتين أو أكثر ليظهر الاتجاه</div>';
      delta.textContent=""; delta.className="trendDelta";
      return;
    }
    var vals=series.map(function(p){ return p.avg; });
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    var pad=(mx-mn)||1;
    host.innerHTML=series.map(function(p,i){
      var h=Math.round(((p.avg-mn)/pad)*60)+22;
      var lastOne=i===series.length-1;
      return '<div class="tBarWrap"><span class="tVal">'+p.avg.toFixed(1)+'</span>'+
             '<div class="tBar'+(lastOne?" on":"")+'" style="height:'+h+'px"></div>'+
             '<span class="tLbl">'+(lastOne?"هذا الأسبوع":"قبل "+(series.length-1-i))+'</span></div>';
    }).join("");

    if(series.length>=2){
      var d=series[series.length-1].avg - series[series.length-2].avg;
      var down=d<0;
      delta.textContent=(down?"▼ ":"▲ ")+Math.abs(d).toFixed(1)+" كجم عن الأسبوع الماضي";
      delta.className="trendDelta "+(down?"down":"up");
    } else {
      delta.textContent=""; delta.className="trendDelta";
    }
  }

  function renderWaist(){
    var w=J(K_WAIST);
    var keys=Object.keys(w).sort();
    var out=document.getElementById("waistOut");
    if(!keys.length){ out.textContent="لم تُسجَّل قياسات بعد"; return; }
    var last=w[keys[keys.length-1]], first=w[keys[0]];
    var d=last-first;
    out.textContent="آخر قياس "+last+" سم"+
      (keys.length>1 ? " · "+(d<0?"نقص ":"زاد ")+Math.abs(d).toFixed(1)+" سم منذ البداية" : "");
  }

  function renderNote(){
    var el=document.getElementById("noteIn");
    if(document.activeElement===el) return;
    el.value=(J(K_NOTE)[todayISO()])||"";
  }

  function renderCal(){
    var log=J(K_LOG);
    if(!calRef) calRef=new Date();
    var y=calRef.getFullYear(), m=calRef.getMonth();
    var names=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    document.getElementById("calTitle").textContent=names[m]+" "+y;

    var first=new Date(y,m,1).getDay();
    var days=new Date(y,m+1,0).getDate();
    var grid=document.getElementById("calGrid");
    var html="";
    for(var i=0;i<first;i++) html+='<span class="calCell empty"></span>';
    for(var d=1; d<=days; d++){
      var key=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      var rec=log[key];
      var cls="none";
      if(rec && rec.t){ cls = rec.d>=rec.t ? "full" : (rec.d>0 ? "part" : "none"); }
      if(key===todayISO()) cls+=" today";
      html+='<span class="calCell '+cls+'">'+d+'</span>';
    }
    grid.innerHTML=html;
  }

  function renderAll(){
    build();
    if(!document.getElementById("progCard")) return;
    writeLog();
    renderStats();
    renderGoal();
    renderTrend();
    renderWaist();
    renderNote();
    renderCal();
  }

  var prev=window.render;
  if(typeof prev==="function"){
    window.render=function(){
      var r=prev.apply(this,arguments);
      try{ renderAll(); }catch(e){}
      return r;
    };
  }
  /* تحديث فوري عند تعليم وجبة أو تسجيل وزن */
  document.addEventListener("click", function(e){
    if(!e.target) return;
    if(e.target.closest(".mealCheck") || e.target.id==="wAdd"){
      setTimeout(function(){ try{ renderAll(); }catch(e){} }, 60);
    }
  });

  try{ renderAll(); }catch(e){}
})();
</script>
<script type="module">
/* ===================================================================
   المزامنة السحابية — تسجيل دخول بغوغل وحفظ تلقائي (Firebase)
   البيانات تُخزَّن تحت معرّف حسابك وحده. لا تمسّ هذه الشيفرة محتوى الرجيمات.
   =================================================================== */
(function(){
  "use strict";

  var K_CFG="diet_fb_cfg_v1";     /* إعدادات Firebase */
  var K_STAMP="diet_sync_at_v1";  /* آخر مزامنة ناجحة */
  var SDK="https://www.gstatic.com/firebasejs/10.12.2/";
  var SKIP={};                    /* مفاتيح لا تُرفع */
  SKIP[K_CFG]=1; SKIP[K_STAMP]=1;

  var app=null, auth=null, db=null, user=null;
  var busy=false, dirty=false, timer=null, ready=false;

  function cfg(){
    try{ var v=JSON.parse(localStorage.getItem(K_CFG)||"null"); return (v&&v.apiKey)? v : null; }
    catch(e){ return null; }
  }
  /* المزامنة تحتاج صفحة مستقلة على عنوان إنترنت حقيقي:
     لا ملفًا محليًا، ولا داخل إطار عارض، ولا عنوانًا مؤقتًا */
  function blocked(){
    try{
      if((navigator.userAgent||"").indexOf("RejimatAndroid")>-1) return "webview";
      if(window.top!==window.self) return "frame";
      if(location.protocol!=="http:" && location.protocol!=="https:") return "local";
      var h=location.hostname||"";
      if(!h || (h.indexOf(".")<0 && h!=="localhost")) return "local";
      return null;
    }catch(e){ return "frame"; }
  }
  function isFile(){ return !!blocked(); }

  function snapshot(){
    var out={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(SKIP[k]) continue;
      out[k]=localStorage.getItem(k);
    }
    return out;
  }
  function applySnapshot(data){
    Object.keys(data||{}).forEach(function(k){
      if(SKIP[k]) return;
      try{ localStorage.setItem(k, String(data[k])); }catch(e){}
    });
  }
  function fmt(ts){
    if(!ts) return "—";
    var d=new Date(ts);
    return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+" "+
           String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  /* ---------- الواجهة ---------- */

  function build(){
    if(document.getElementById("syncCard")) return;
    var host=document.getElementById("progCard");
    if(!host){ var cs=document.querySelectorAll("body > .card"); host=cs[cs.length-1]; }
    if(!host) return;
    var c=document.createElement("div");
    c.className="card syncCard";
    c.id="syncCard";
    c.innerHTML=
      '<div class="secHead"><h2>المزامنة السحابية</h2><span class="syncDot" id="syncDot"></span></div>'+
      '<div class="syncBody" id="syncBody"></div>';
    host.insertAdjacentElement("afterend", c);
  }

  function paint(){
    build();
    var body=document.getElementById("syncBody");
    var dot=document.getElementById("syncDot");
    if(!body) return;
    var c=cfg();

    if(isFile()){
      dot.className="syncDot off";
      var why=blocked();
      body.innerHTML='<div class="syncMsg warn">'+
        '<b>المزامنة تحتاج أن يكون التطبيق على عنوان إنترنت</b>'+
        (why==="webview"
          ? 'أنت داخل تطبيق أندرويد، وغوغل تمنع تسجيل الدخول داخل WebView لأسباب أمنية. '+
            'استعمل «نسخة احتياطية» في قسم حساب لحفظ بياناتك ونقلها.'
          : why==="frame"
          ? 'أنت تفتح التطبيق داخل عارض ملفات، وغوغل تمنع تسجيل الدخول داخل الإطارات. '+
            'ارفع التطبيق على GitHub Pages ثم افتحه من عنوانه في كروم، وستجد هنا زر تسجيل الدخول.'
          : 'تسجيل الدخول بغوغل لا يعمل عند فتح الملف من مجلد التنزيلات. '+
            'ارفع التطبيق على GitHub Pages ثم افتحه من عنوانه في كروم، وستجد هنا زر تسجيل الدخول.')+
        '</div>'+
        '<div class="small" style="margin-top:10px">حتى ذلك الحين استعمل «نسخة احتياطية» في قسم حساب.</div>';
      return;
    }

    if(!c){
      dot.className="syncDot off";
      body.innerHTML='<div class="syncMsg">'+
          'لتفعيل الحفظ التلقائي أنشئ مشروع Firebase مجانيًا والصق إعداداته هنا مرة واحدة.'+
        '</div>'+
        '<textarea id="cfgIn" rows="4" placeholder=\'{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }\'></textarea>'+
        '<div class="row" style="margin-top:10px">'+
          '<button type="button" id="cfgSave" class="btnPrimary">تفعيل المزامنة</button>'+
          '<button type="button" id="cfgHelp" class="btnSoft">كيف أحصل عليها؟</button>'+
        '</div>'+
        '<div class="syncHelp" id="cfgHelpBox" style="display:none">'+
          '<ol>'+
            '<li>افتح <b>console.firebase.google.com</b> وأنشئ مشروعًا جديدًا.</li>'+
            '<li>من <b>Build ← Authentication ← Sign-in method</b> فعّل <b>Google</b>.</li>'+
            '<li>من <b>Build ← Firestore Database</b> أنشئ قاعدة بيانات واختر <b>Production mode</b>.</li>'+
            '<li>في <b>Rules</b> الصق هذه القاعدة — هي التي تمنع أي شخص من رؤية بياناتك:'+
              '<pre>match /users/{uid} {\n  allow read, write:\n    if request.auth != null\n    &amp;&amp; request.auth.uid == uid;\n}</pre></li>'+
            '<li>من <b>Project settings ← Your apps</b> أضف تطبيق ويب، وانسخ كائن <b>firebaseConfig</b> والصقه في الخانة أعلاه.</li>'+
            '<li>في <b>Authentication ← Settings ← Authorized domains</b> أضف نطاق موقعك.</li>'+
          '</ol>'+
        '</div>';
      document.getElementById("cfgSave").onclick=saveCfg;
      document.getElementById("cfgHelp").onclick=function(){
        var b=document.getElementById("cfgHelpBox");
        b.style.display = b.style.display==="none" ? "block" : "none";
      };
      return;
    }

    if(!user){
      dot.className="syncDot off";
      body.innerHTML='<div class="syncMsg">سجّل دخولك مرة واحدة، وبعدها يُحفظ كل شيء تلقائيًا.</div>'+
        '<div class="row" style="margin-top:12px">'+
          '<button type="button" id="inBtn" class="btnPrimary">تسجيل الدخول بغوغل</button>'+
          '<button type="button" id="cfgClear" class="btnSoft">تغيير الإعدادات</button>'+
        '</div>';
      document.getElementById("inBtn").onclick=signIn;
      document.getElementById("cfgClear").onclick=function(){
        localStorage.removeItem(K_CFG); location.reload();
      };
      return;
    }

    dot.className="syncDot on";
    body.innerHTML=
      '<div class="syncUser">'+
        '<span class="syncWho">'+(user.email||user.displayName||"حسابك")+'</span>'+
        '<span class="syncWhen small" id="syncWhen">آخر حفظ: '+fmt(Number(localStorage.getItem(K_STAMP)||0))+'</span>'+
      '</div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button type="button" id="pullBtn" class="btnSoft">استعادة من السحابة</button>'+
        '<button type="button" id="outBtn" class="btnSoft">خروج</button>'+
      '</div>'+
      '<div class="small" style="margin-top:10px">يُحفظ تلقائيًا بعد كل تغيير بثوانٍ.</div>';
    document.getElementById("pullBtn").onclick=function(){ pull(true); };
    document.getElementById("outBtn").onclick=signOutNow;
  }

  function saveCfg(){
    var raw=(document.getElementById("cfgIn").value||"").trim();
    /* يقبل الكائن كما يُنسخ من Firebase حتى لو بلا علامات اقتباس حول المفاتيح */
    var m=raw.match(/\{[\s\S]*\}/);
    if(!m){ alert("الصق كائن firebaseConfig كاملًا"); return; }
    var txt=m[0].replace(/([{,]\s*)([A-Za-z_][\w]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}");
    var obj=null;
    try{ obj=JSON.parse(txt); }catch(e){ obj=null; }
    if(!obj||!obj.apiKey||!obj.projectId){ alert("الإعدادات غير مكتملة"); return; }
    localStorage.setItem(K_CFG, JSON.stringify(obj));
    location.reload();
  }

  /* ---------- Firebase ---------- */

  function boot(){
    var c=cfg();
    if(!c||isFile()){ paint(); return; }
    Promise.all([
      import(SDK+"firebase-app.js"),
      import(SDK+"firebase-auth.js"),
      import(SDK+"firebase-firestore.js")
    ]).then(function(mods){
      var A=mods[0], U=mods[1], F=mods[2];
      app=A.initializeApp(c);
      auth=U.getAuth(app);
      db=F.getFirestore(app);
      window.__fbU=U; window.__fbF=F;

      U.getRedirectResult(auth).catch(function(){});
      U.onAuthStateChanged(auth, function(u){
        user=u||null;
        paint();
        if(user){ ready=true; pull(false); }
      });
    }).catch(function(e){
      paint();
      var b=document.getElementById("syncBody");
      if(b) b.insertAdjacentHTML("beforeend",
        '<div class="syncMsg warn" style="margin-top:10px">تعذّر تحميل المزامنة. تأكد من الاتصال ومن صحة الإعدادات.</div>');
    });
  }

  function signIn(){
    if(!auth) return;
    var U=window.__fbU;
    var p=new U.GoogleAuthProvider();
    U.signInWithPopup(auth,p).catch(function(){
      U.signInWithRedirect(auth,p).catch(function(){
        alert("تعذّر تسجيل الدخول. تأكد أن نطاق الموقع مضاف في Authorized domains.");
      });
    });
  }
  function signOutNow(){
    if(!auth) return;
    window.__fbU.signOut(auth).then(function(){ user=null; paint(); });
  }

  function ref(){
    var F=window.__fbF;
    return F.doc(db,"users",user.uid);
  }

  /* السحب: عند الدخول يوازن بين الجهاز والسحابة بدل الطمس الأعمى */
  function pull(manual){
    if(!user||!db) return;
    var F=window.__fbF;
    F.getDoc(ref()).then(function(snap){
      var remote=snap.exists()? snap.data() : null;
      var localAt=Number(localStorage.getItem(K_STAMP)||0);
      var hasLocal=Object.keys(snapshot()).length>0;

      if(!remote||!remote.data){ push(); return; }
      if(manual){
        if(confirm("استبدال بيانات هذا الجهاز ببيانات السحابة؟")){ restore(remote); }
        return;
      }
      if(!hasLocal){ restore(remote); return; }
      if((remote.at||0) > localAt + 1000){
        if(confirm("توجد بيانات أحدث في السحابة. هل تستعيدها؟ (سيُستبدل ما على هذا الجهاز)")){
          restore(remote);
        } else { push(); }
      } else {
        push();
      }
    }).catch(function(){});
  }

  function restore(remote){
    applySnapshot(remote.data);
    localStorage.setItem(K_STAMP, String(remote.at||Date.now()));
    location.reload();
  }

  function push(){
    if(!user||!db||busy) return;
    busy=true;
    var F=window.__fbF;
    var at=Date.now();
    F.setDoc(ref(), {data:snapshot(), at:at, email:user.email||""})
      .then(function(){
        localStorage.setItem(K_STAMP,String(at));
        var w=document.getElementById("syncWhen");
        if(w) w.textContent="آخر حفظ: "+fmt(at);
      })
      .catch(function(){})
      .then(function(){ busy=false; if(dirty){ dirty=false; schedule(); } });
  }

  function schedule(){
    if(!ready||!user) return;
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(busy){ dirty=true; return; }
      push();
    }, 2500);
  }

  /* أي كتابة في التخزين المحلي تُجدول رفعًا */
  var origSet=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    var r=origSet.apply(this,arguments);
    try{ if(!SKIP[k]) schedule(); }catch(e){}
    return r;
  };
  window.addEventListener("beforeunload",function(){
    if(ready&&user&&!busy){ try{ push(); }catch(e){} }
  });

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",boot);
  } else { boot(); }
})();
</script>
<script>
/* ===================================================================
   شارة تصنيف الأنظمة — لا تغيّر أي نظام، تضع بجانبه تقييمًا فقط
   =================================================================== */
(function(){
  "use strict";

  var KINDS={
    strong:{t:"دليل قوي",        c:"bStrong",
            d:"مدعوم بدراسات واسعة ومراجعات منهجية، وآمن على المدى الطويل."},
    ok:    {t:"متوازن",          c:"bOk",
            d:"ثلاث وجبات أو أكثر، وبروتين كافٍ، وهدف واقعي لا يتجاوز كيلوغرامًا أسبوعيًا."},
    care:  {t:"مقيّد — انتبه",   c:"bCare",
            d:"يمنع مجموعات غذائية أو يخفض السعرات كثيرًا. قد ينجح لفترة قصيرة، لكنه يحتاج انتباهًا ومتابعة."},
    hype:  {t:"وعد غير واقعي",   c:"bHype",
            d:"الوزن الموعود أسرع مما يمكن خسارته دهنًا. ما ينزل بهذه السرعة معظمه ماء وكتلة عضلية، ويعود سريعًا."}
  };

  var MAP={
    /* الأنظمة الأصلية */
    "رجيم الشوربة":"hype",
    "روجيم بدون نشويات":"hype",
    "رجيم البيض":"care",
    "رجيم الكربوهيدرات":"hype",
    "رجيم الماء":"care",
    "رجيم سمنة البطن":"care",
    "رجيم معهد ماكس بلانك":"hype",
    "رجيم وجبة كل ساعتين":"hype",
    "رجيم بدون الشعور بالجوع":"hype",
    "رجيم الثلاثة أيام":"hype",
    "رجيم أربعة أيام":"care",
    "رجيم خمسة أيام":"care",
    "رجيم لمدة أسبوع":"care",
    "وجبة 800 سعرة حرارية":"care",
    "وجبة 1200 سعرة حرارية":"ok",
    "رجيم لمدة شهر واحد":"care",
    "الرجيم السريع":"hype",
    "الرجيم الكيميائي":"care",
    "رجيم خمسة كيلو جرام":"ok",
    "شوربة حرق الشحوم":"hype",
    "رجيم خاص بالنباتيين":"hype",
    /* الأنظمة المضافة */
    "رجيم الكربوهيدرات — نسخة ألمانيا":"ok",
    "نظام الكيتو":"care",
    "حمية البحر المتوسط":"strong",
    "رجيم ألماني سريع":"ok",
    "برنامج مكثّف — ثمانية أسابيع":"ok"
  };

  var NOTE={
    "رجيم سمنة البطن":"لا يوجد رجيم يحرق الدهن من منطقة بعينها. الجسم يسحب من كل مكان."
  };

  function build(){
    var t=document.getElementById("planTitle");
    if(!t || document.getElementById("planBadge")) return;
    var b=document.createElement("button");
    b.type="button"; b.id="planBadge"; b.className="planBadge";
    t.insertAdjacentElement("afterend", b);
    var note=document.createElement("div");
    note.id="badgeNote"; note.className="badgeNote"; note.style.display="none";
    b.insertAdjacentElement("afterend", note);
    b.addEventListener("click", function(){
      note.style.display = note.style.display==="none" ? "block" : "none";
    });
  }

  function paint(){
    build();
    var b=document.getElementById("planBadge");
    var note=document.getElementById("badgeNote");
    var t=document.getElementById("planTitle");
    if(!b||!t) return;
    var name=(t.textContent||"").trim();
    var key=MAP[name];
    if(!key){ b.style.display="none"; note.style.display="none"; return; }
    var k=KINDS[key];
    b.style.display="";
    b.className="planBadge "+k.c;
    b.textContent=k.t;
    b.setAttribute("aria-label","تصنيف النظام: "+k.t);
    note.textContent = k.d + (NOTE[name] ? "  " + NOTE[name] : "");
  }

  var prev=window.render;
  if(typeof prev==="function"){
    window.render=function(){
      var r=prev.apply(this,arguments);
      try{ paint(); }catch(e){}
      return r;
    };
  }
  try{ paint(); }catch(e){}
})();
</script>
<script>
/* قلب اليوم تلقائياً: عند تغيّر التاريخ (منتصف الليل) أو عند العودة للتطبيق بعد إطفاء الشاشة أو بقائه مفتوحاً */
(function(){
  function key(){var d=new Date();return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
  var last=key();
  function check(){
    var k=key();
    if(k===last) return;
    last=k;
    try{ window.render(); }catch(e){}
  }
  setInterval(check, 15000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) check(); });
  window.addEventListener("focus", check);
  window.addEventListener("pageshow", check);
  window.addEventListener("online", check);
  /* مؤقت دقيق لمنتصف الليل القادم */
  function arm(){
    var n=new Date(), m=new Date(n.getFullYear(), n.getMonth(), n.getDate()+1, 0, 0, 2);
    setTimeout(function(){ check(); arm(); }, Math.min(m-n, 2147483000));
  }
  arm();
})();
</script>
